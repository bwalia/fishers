name: Register kubepilot demo edge

# Applies demo.kubepilot.org Cloudflare CNAME + wslproxy vhost/rule using this
# repo's existing edge secrets. Specs are read from bwalia/kubepilot
# deploy/wslproxy (app source of truth). Companion POP files live in
# bwalia/wslproxy data/servers|rules/prod.

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "Print actions without writing"
        type: boolean
        required: false
        default: false
  # Re-assert hourly so accidental CF/edge deletes heal (same idea as
  # cloudflare-dns-reconcile for fishers.cloud).
  schedule:
    - cron: "23 * * * *"

env:
  ZONE: kubepilot.org
  CNAME_TARGET: lon1.pop0.uk
  DEMO_HOST: demo.kubepilot.org
  KUBEPILOT_REF: master

permissions:
  contents: read

concurrency:
  group: kubepilot-demo-edge-from-fishers
  cancel-in-progress: false

jobs:
  register:
    name: Register demo.kubepilot.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kubepilot edge specs
        uses: actions/checkout@v4
        with:
          repository: bwalia/kubepilot
          ref: ${{ env.KUBEPILOT_REF }}
          path: kubepilot
          token: ${{ secrets.RP_GITHUB_TOKEN || github.token }}

      - name: Ensure Cloudflare CNAME (DNS-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.DRY_RUN || false }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."; exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would upsert CNAME ${DEMO_HOST} -> ${CNAME_TARGET}"
            exit 0
          fi
          cd kubepilot
          chmod +x scripts/upsert-demo-cname.sh
          ./scripts/upsert-demo-cname.sh

      - name: Import wslproxy rule + vhost
        env:
          WSLPROXY_USER: ${{ secrets.WSLPROXY_USER }}
          WSLPROXY_PASSWORD: ${{ secrets.WSLPROXY_PASSWORD }}
          WSLPROXY_GATEWAY_URL: ${{ secrets.WSLPROXY_GATEWAY_URL }}
          DRY_RUN: ${{ inputs.DRY_RUN || false }}
        run: |
          set -euo pipefail
          if [ -z "${WSLPROXY_USER:-}" ] || [ -z "${WSLPROXY_PASSWORD:-}" ] || [ -z "${WSLPROXY_GATEWAY_URL:-}" ]; then
            echo "::error::WSLPROXY_* secrets missing."; exit 1
          fi
          HOST_SPEC="kubepilot/deploy/wslproxy/host-${DEMO_HOST}.json"
          RULE_SPEC="kubepilot/deploy/wslproxy/rule-kubepilot-demo-default.json"
          [ -f "$HOST_SPEC" ] && [ -f "$RULE_SPEC" ]

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would import $(jq -r .id "$RULE_SPEC") + $(jq -r .id "$HOST_SPEC")"
            exit 0
          fi

          GW="$WSLPROXY_GATEWAY_URL"
          TOKEN=$(curl -fsS -X POST "$GW/api/user/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg e "$WSLPROXY_USER" --arg p "$WSLPROXY_PASSWORD" '{email:$e,password:$p}')" \
            | jq -r '.data.accessToken // .accessToken // empty')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]

          import() {
            local dtype="$1" arr="$2" body resp code
            body=$(jq -cn --argjson data "$arr" --arg dt "$dtype" '{data: $data, dataType: $dt}')
            resp=$(curl -sS --max-time 60 -w "\n%{http_code}" \
              -X POST "${GW%/}/api/projects/import?_format=json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-platform: react-admin" \
              -H "Content-Type: application/json" \
              --data-raw "$body")
            code=$(echo "$resp" | tail -n1)
            echo "dataType=$dtype -> HTTP $code"
            case "$code" in 200|201) ;; *) echo "$resp" | sed '$d'; return 1 ;; esac
          }

          import rules "$(jq -s '.' "$RULE_SPEC")"
          import servers "$(jq -s '.' "$HOST_SPEC")"

      - name: Smoke public healthz
        if: ${{ (inputs.DRY_RUN || false) != true }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if out=$(curl -fsS --max-time 15 "https://${DEMO_HOST}/healthz" 2>/dev/null); then
              echo "$out" | grep -q ok && { echo "https://${DEMO_HOST}/healthz ok"; exit 0; }
            fi
            echo "attempt $i; sleep 15"; sleep 15
          done
          echo "::warning::public smoke still failing — DNS/ACME may still be propagating"
          curl -sS -m 15 -D- -o /dev/null "https://${DEMO_HOST}/healthz" || true
          exit 0
