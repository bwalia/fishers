name: Register kubepilot demo edge

# Applies demo.kubepilot.org Cloudflare CNAME + wslproxy vhost/rule using this
# repo's existing edge secrets.
#
# Specs (keep in sync with bwalia/kubepilot deploy/wslproxy/):
#   devops/wslproxy/host-demo.kubepilot.org.json
#   devops/wslproxy/rule-kubepilot-demo-default.json
#
# Companion POP files: bwalia/wslproxy data/servers|rules/prod (Deploy Virtual
# Servers → lon1).

on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "Print actions without writing"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "devops/wslproxy/host-demo.kubepilot.org.json"
      - "devops/wslproxy/rule-kubepilot-demo-default.json"
      - ".github/workflows/register-kubepilot-demo-edge.yml"
  schedule:
    - cron: "23 * * * *"

env:
  ZONE: kubepilot.org
  CNAME_TARGET: lon1.pop0.uk
  DEMO_HOST: demo.kubepilot.org

permissions:
  contents: read

concurrency:
  group: kubepilot-demo-edge-from-fishers
  cancel-in-progress: false

jobs:
  register:
    name: Register demo.kubepilot.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Cloudflare CNAME (DNS-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.DRY_RUN || false }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."; exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would upsert CNAME ${DEMO_HOST} -> ${CNAME_TARGET}"
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_id=$(curl -fsS "${auth[@]}" "$api/zones?name=${ZONE}" | jq -r '.result[0].id // empty')
          [ -n "$zone_id" ] || { echo "::error::zone ${ZONE} not visible to token"; exit 1; }
          rec_id=$(curl -fsS "${auth[@]}" \
            "$api/zones/$zone_id/dns_records?type=CNAME&name=${DEMO_HOST}" \
            | jq -r '.result[0].id // empty')
          body=$(jq -nc --arg name "$DEMO_HOST" --arg content "$CNAME_TARGET" \
            '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')
          if [ -n "$rec_id" ]; then
            curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$rec_id" --data "$body" >/dev/null
            echo "updated CNAME ${DEMO_HOST} -> ${CNAME_TARGET}"
          else
            curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$body" >/dev/null
            echo "created CNAME ${DEMO_HOST} -> ${CNAME_TARGET}"
          fi

      - name: Import wslproxy rule + vhost
        env:
          WSLPROXY_USER: ${{ secrets.WSLPROXY_USER }}
          WSLPROXY_PASSWORD: ${{ secrets.WSLPROXY_PASSWORD }}
          WSLPROXY_GATEWAY_URL: ${{ secrets.WSLPROXY_GATEWAY_URL }}
          DRY_RUN: ${{ inputs.DRY_RUN || false }}
        run: |
          set -euo pipefail
          if [ -z "${WSLPROXY_USER:-}" ] || [ -z "${WSLPROXY_PASSWORD:-}" ] || [ -z "${WSLPROXY_GATEWAY_URL:-}" ]; then
            echo "::error::WSLPROXY_* secrets missing."; exit 1
          fi
          HOST_SPEC="devops/wslproxy/host-${DEMO_HOST}.json"
          RULE_SPEC="devops/wslproxy/rule-kubepilot-demo-default.json"
          [ -f "$HOST_SPEC" ] || { echo "::error::missing $HOST_SPEC"; exit 1; }
          [ -f "$RULE_SPEC" ] || { echo "::error::missing $RULE_SPEC"; exit 1; }
          spec_host=$(jq -r '.server_name' "$HOST_SPEC")
          [ "$spec_host" = "$DEMO_HOST" ] || { echo "::error::server_name mismatch"; exit 1; }

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN: would import $(jq -r .id "$RULE_SPEC") + $(jq -r .id "$HOST_SPEC")"
            exit 0
          fi

          GW="$WSLPROXY_GATEWAY_URL"
          TOKEN=$(curl -fsS -X POST "$GW/api/user/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg e "$WSLPROXY_USER" --arg p "$WSLPROXY_PASSWORD" '{email:$e,password:$p}')" \
            | jq -r '.data.accessToken // .accessToken // empty')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]

          import() {
            local dtype="$1" arr="$2" body resp code
            body=$(jq -cn --argjson data "$arr" --arg dt "$dtype" '{data: $data, dataType: $dt}')
            resp=$(curl -sS --max-time 60 -w "\n%{http_code}" \
              -X POST "${GW%/}/api/projects/import?_format=json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-platform: react-admin" \
              -H "Content-Type: application/json" \
              --data-raw "$body")
            code=$(echo "$resp" | tail -n1)
            echo "dataType=$dtype -> HTTP $code"
            case "$code" in 200|201) ;; *) echo "$resp" | sed '$d'; return 1 ;; esac
          }

          import rules "$(jq -s '.' "$RULE_SPEC")"
          import servers "$(jq -s '.' "$HOST_SPEC")"

      - name: Smoke public healthz
        if: ${{ (inputs.DRY_RUN || false) != true }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if out=$(curl -fsS --max-time 15 "https://${DEMO_HOST}/healthz" 2>/dev/null); then
              echo "$out" | grep -q ok && { echo "https://${DEMO_HOST}/healthz ok"; exit 0; }
            fi
            echo "attempt $i; sleep 15"; sleep 15
          done
          echo "::warning::public smoke still failing — DNS/ACME may still be propagating"
          curl -sS -m 15 -D- -o /dev/null "https://${DEMO_HOST}/healthz" || true
          exit 0
