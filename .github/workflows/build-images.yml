name: Build images

# Builds and pushes fishers-api and fishers-web from a given git ref.
#
# Called by deploy-single-environment.yml, and dispatchable on its own when you
# want an image without a deploy. int and test build; acc and prod do not —
# they deploy the tag those builds already pushed, so what reaches production
# is the artefact that was tested, not a rebuild of the same source that might
# not be the same artefact.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true
      brands:
        description: >-
          Space-separated brands to build the dashboard for. The API is not
          built per brand: it is the same code, and each brand's deployment
          points it at its own database. The dashboard is, because the brand is
          baked into the bundle.
        type: string
        required: false
        default: fishers
      image_tag:
        description: "Tag to push"
        type: string
        required: false
        default: latest
      registry_provider:
        type: string
        required: false
        default: NEBULACR
    secrets:
      NEBULACR_REGISTRY:     { required: false }
      NEBULACR_USERNAME:     { required: false }
      NEBULACR_PASSWORD:     { required: false }
      GHCR_TOKEN:            { required: false }
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true
        default: main
      image_tag:
        description: "Tag to push"
        type: string
        required: false
        default: latest
      registry_provider:
        type: choice
        required: false
        default: NEBULACR
        options: [NEBULACR, GHCR]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ inputs.image_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The sha tag has to name the commit that was just checked out, and
      # github.sha is not it. In a reusable workflow github.sha is the CALLER's
      # commit — main, for a dispatch — while `ref` is whatever was asked for: a
      # tag, a branch, an older sha. Deploying a ref other than main therefore
      # built the right source, pushed it under main's sha, and left the deploy
      # asking the registry for the ref's sha, which nothing had ever pushed.
      # The ring sat in ImagePullBackOff until helm --wait gave up ten minutes
      # later with 'context deadline exceeded' and no mention of an image.
      - name: Resolve the built commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve registry
        id: reg
        run: |
          set -euo pipefail
          case "${{ inputs.registry_provider || 'NEBULACR' }}" in
            GHCR)
              HOST="ghcr.io"
              USER="${{ github.actor }}"
              PASS="${{ secrets.GHCR_TOKEN || github.token }}"
              NS="ghcr.io/${{ github.repository_owner }}"
              ;;
            *)
              # The registry host is NOT the secret NAME. The NEBULACR_* secrets
              # hold spectoncr credentials — "nebulacr" survives from the k8s
              # pull-secret name (nebulacr-login) on the shared platform. The
              # host this used to default to, nebulacr.workstation.co.uk, has no
              # wslproxy vhost and so no certificate: docker login failed there
              # with "certificate is not valid for any names" before it ever got
              # as far as authenticating.
              #
              # One registry for every ring, deliberately: an image is built once
              # and the same artefact is promoted to acc/prod, so a per-ring host
              # would mean re-pushing what was already tested.
              HOST="${{ secrets.NEBULACR_REGISTRY || 'int-spectoncr.diytaxreturn.co.uk' }}"
              USER="${{ secrets.NEBULACR_USERNAME }}"
              PASS="${{ secrets.NEBULACR_PASSWORD }}"
              NS="$HOST/fishers"
              ;;
          esac
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::registry credentials are not set for ${{ inputs.registry_provider || 'NEBULACR' }}."
            echo "::error::Add NEBULACR_USERNAME / NEBULACR_PASSWORD (or GHCR_TOKEN) to this repository."
            exit 1
          fi
          echo "host=$HOST"      >> "$GITHUB_OUTPUT"
          echo "user=$USER"      >> "$GITHUB_OUTPUT"
          echo "api=$NS/fishers-api" >> "$GITHUB_OUTPUT"
          echo "ns=$NS"              >> "$GITHUB_OUTPUT"
          echo "::add-mask::$PASS"
          echo "pass=$PASS"      >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ steps.reg.outputs.user }}
          password: ${{ steps.reg.outputs.pass }}

      # Both images also carry the commit sha, so a ring can be pinned to an
      # exact build when :latest has already moved on.
      - name: Build and push fishers-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.reg.outputs.api }}:${{ inputs.image_tag || 'latest' }}
            ${{ steps.reg.outputs.api }}:${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=fishers-api
          cache-to: type=gha,scope=fishers-api,mode=max

      # One dashboard image per brand, each named for its brand. The brand is
      # baked into the bundle, so a single image cannot serve two — and a
      # deploy that pulled the wrong one would look right until somebody read
      # the logo.
      #
      # The context is the repo root, not web/: the brand lives in brands/ and
      # is turned into code by tools/brand, and neither is inside web/.
      - name: Build and push each brand's dashboard
        env:
          BRANDS: ${{ inputs.brands || 'fishers' }}
          NS: ${{ steps.reg.outputs.ns }}
          TAG: ${{ inputs.image_tag || 'latest' }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for brand in $BRANDS; do
            echo "::group::$brand"
            docker buildx build \
              --file ./web/Dockerfile \
              --build-arg "BRAND=$brand" \
              --tag "$NS/$brand-web:$TAG" \
              --tag "$NS/$brand-web:$SHA" \
              --cache-from "type=gha,scope=$brand-web" \
              --cache-to "type=gha,scope=$brand-web,mode=max" \
              --push \
              .
            echo "::endgroup::"
          done

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo "- \`${{ steps.reg.outputs.api }}:${{ inputs.image_tag || 'latest' }}\`"
            for brand in ${{ inputs.brands || 'fishers' }}; do
              echo "- \`${{ steps.reg.outputs.ns }}/$brand-web:${{ inputs.image_tag || 'latest' }}\`"
            done
            echo "- also tagged \`${{ steps.commit.outputs.sha }}\`, the commit \`${{ inputs.ref }}\` resolved to"
          } >> "$GITHUB_STEP_SUMMARY"
