name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml names brand.xcconfig, which does not exist until this has
      # run. The brand also decides the bundle identifier, so a build without
      # it would be signed as the wrong app.
      # working-directory for this job is `ios`, and the brand tool lives at the
      # repo root — hence the explicit override rather than a relative path
      # that reads correctly and resolves to ios/tools/brand.
      - name: Brand
        working-directory: .
        run: |
          npm ci --omit=dev --prefix tools/brand
          node tools/brand/index.mjs generate "$BRAND" --ios
        env:
          BRAND: ${{ inputs.brand || 'fishers' }}

      # A generated palette the app never reads still compiles, and a hardcoded
      # name still renders, so neither shows up as a failure — the app just
      # ships as the wrong brand. This is the check that notices.
      - name: The app reads the brand rather than naming it
        working-directory: .
        run: python3 scripts/check-brand-literals.py

      # The phone's words come from the web's dictionaries. Nothing stops
      # somebody adding a string for the web and not regenerating, and the app
      # would then quietly show English for it — which is exactly how one
      # platform ends up a translation behind the other.
      - name: The phone's strings match the web's
        working-directory: .
        run: node tools/i18n/index.mjs --check

      # A ratchet. It may fall and must never rise. "Nothing left in English"
      # was claimed twice from a tool that only looked at part of the app; a
      # number here is harder to fool than a sentence in a commit message.
      - name: No new English hardcoded into the app
        working-directory: .
        run: node tools/i18n/audit-swift.mjs --max=149

      # Zero, and it stays zero. A string the app can show with no entry reads
      # in English however well the wrapping was done.
      - name: Nothing the app can say is missing from the dictionary
        working-directory: .
        run: node tools/i18n/gap.mjs --strict

      # And none of these may come back: a sentence built by gluing pieces
      # together cannot be reordered by a translator.
      - name: No sentences built at runtime in a drawn position
        working-directory: .
        run: |
          n=$(node tools/i18n/interpolated.mjs | grep -oE '^[0-9]+')
          [ "$n" = "0" ] || { node tools/i18n/interpolated.mjs --list; exit 1; }

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Simulator)
        run: |
          xcodebuild build \
            -project Fishers.xcodeproj \
            -scheme Fishers \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Test
        run: |
          xcodebuild test \
            -project Fishers.xcodeproj \
            -scheme Fishers \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -quiet
