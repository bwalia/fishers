name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml names brand.xcconfig, which does not exist until this has
      # run. The brand also decides the bundle identifier, so a build without
      # it would be signed as the wrong app.
      # working-directory for this job is `ios`, and the brand tool lives at the
      # repo root — hence the explicit override rather than a relative path
      # that reads correctly and resolves to ios/tools/brand.
      - name: Brand
        working-directory: .
        run: |
          npm ci --omit=dev --prefix tools/brand
          node tools/brand/index.mjs generate "$BRAND" --ios
        env:
          BRAND: ${{ inputs.brand || 'fishers' }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Simulator)
        run: |
          xcodebuild build \
            -project Fishers.xcodeproj \
            -scheme Fishers \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Test
        run: |
          xcodebuild test \
            -project Fishers.xcodeproj \
            -scheme Fishers \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -quiet
