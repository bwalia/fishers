name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      # Same list as push: an edit to this file should be checked by this file,
      # not discovered on main.
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The repo uses runtime sqlx queries, not the compile-time macros, so the
      # workspace builds and the domain tests run with no database at all.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fishers
          POSTGRES_PASSWORD: fishers
          POSTGRES_DB: fishers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishers -d fishers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Run migrations
        env:
          DATABASE_URL: postgres://fishers:fishers@localhost:5432/fishers
        run: sqlx migrate run --source db/migrations

  image:
    name: The API image still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `cargo build` passing is not the same as the image building. The
      # Dockerfile stubs every workspace member to cache the ~400 dependency
      # crates, and cargo reads every member's manifest before building any of
      # them — so adding a crate to the workspace and not to that list breaks
      # the image while every other check stays green.
      #
      # That happened: the ffi crate went in on 23 September and CD was red for
      # eighteen hours with nothing deployed, because no PR check built an
      # image. This is that check.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=fishers-api
          cache-to: type=gha,scope=fishers-api,mode=max
