name: Web

# Lint and type-check the dashboard on every change to it.
#
# The linter is here because it was not anywhere: `npm run lint` was
# `next lint` with no ESLint installed behind it, so running it dropped into an
# interactive setup prompt and exited without linting a thing. A check that
# reads as passing because it never ran is worse than no check, and the only
# reliable way to keep it from going back to that is for CI to run it.
#
# `next build` is the type-check: the dashboard has no test suite of its own,
# and the end-to-end journey in e2e.yml is what covers its behaviour.

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: fishers-web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The brand is generated before the build, from brands/<id>.yaml. The
      # generated files are not committed, so this is what makes them exist.
      - name: Brand tool
        working-directory: tools/brand
        run: npm ci --omit=dev

      - name: Every brand is readable
        working-directory: tools/brand
        run: node index.mjs check

      # PyYAML accepts a duplicate key and keeps the last one; GitHub rejects
      # the file with "this run likely failed because of a workflow file
      # issue" and no line number. That happened, so this checks it.
      - name: Workflows are what GitHub will accept
        # The job's working-directory is `web`, and this script is at the repo
        # root — so without this it looked for `web/scripts/` and every run of
        # this workflow failed on it.
        working-directory: .
        run: python3 scripts/check-workflows.py

      - name: Lint
        run: npm run lint

      # Nothing is set here on purpose: no NEXT_PUBLIC_API_PORT and no .env, so
      # this builds the way a fresh checkout does and the defaults in
      # src/lib/ports.ts are what get compiled in.
      - name: Build
        run: npm run build
