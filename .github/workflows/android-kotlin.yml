name: Android (Kotlin)

# Build and test the Kotlin + Compose app.
#
# Separate from android.yml, which still watches `flutter/`. Both are here while
# the port is in progress: the Flutter app is what ships until this one reaches
# parity, so breaking it silently is not an option either.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:

concurrency:
  group: fishers-android-kotlin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 is what the app compiles against; AGP itself wants a newer one, and
      # the toolchain below is what reconciles the two.
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # The cricket engine is Rust, cross-compiled into the app, so the Android
      # build needs a Rust toolchain and the NDK. There is no fallback on
      # purpose: a build that quietly skipped the engine would produce an app
      # with no scoring rules at all.
      - name: Rust, with the Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      # The brand's resources are generated by tools/brand, which needs its
      # dependencies before Gradle can run it.
      - name: Brand tool
        working-directory: tools/brand
        run: npm ci

      - name: Every brand is readable
        working-directory: tools/brand
        run: node index.mjs check

      # Generated resources the app never reads still build, and a hardcoded
      # name still renders, so neither fails — the flavour just ships as the
      # wrong brand. This is the check that notices.
      - name: The app reads the brand rather than naming it
        working-directory: .
        run: python3 scripts/check-brand-literals.py

      # The flavour's applicationId and the brand file's bundle id are typed
      # out in two places. Disagreeing silently sends one brand's code to the
      # other's Play listing.
      - name: The flavours match the brand files
        working-directory: .
        run: python3 scripts/check-android-flavours.py

      - name: Unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew :app:testFishersDebugUnitTest --no-daemon

      # The honest check: the Kotlin compiling is not the same as an APK that
      # links, packages and passes resource linking.
      # Every brand, because a flavour that stops building is a listing that
      # stops shipping, and nothing else would notice until release day.
      - name: Every brand's APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew :app:assembleFishersDebug :app:assembleGullycricketDebug --no-daemon

      - name: Keep the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fishers-android-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
