name: CD — deploy int on merge to main

# Continuous deployment for the int ring. Every merge to main lands on every
# brand's int without anybody dispatching anything — https://int.fishers.cloud
# and https://int.gullycricket.app today.
#
# A brand is a whole stack, not a skin: its own namespace, its own API, its own
# database. The matrix at the bottom is what fans this out, and the brand files
# in brands/ are what each deploy reads to know where it goes.
#
# The chain is edge -> build -> deploy, and the order is the point:
#
#   edge    Cloudflare CNAME + wslproxy vhost for int.fishers.cloud. Both are
#           idempotent upserts, so this is a no-op once the ring exists — but
#           without it a brand-new ring deploys green and is unreachable, and
#           the wslproxy edge answers the fallback vhost's self-signed cert,
#           which reads as a broken app rather than missing edge config.
#   build   Pushes fishers-api and fishers-web. build-images.yml already tags
#           every build with both :latest and the commit sha.
#   deploy  Helm, ring int, pinned to this commit's sha.
#
# Why the sha and not :latest — the trap this exists to avoid:
# helm upgrade with an unchanged tag renders an identical Deployment spec, so
# Kubernetes has nothing to roll and the old pods keep serving. imagePullPolicy
# Always does not save it: that governs what happens when a pod is CREATED, and
# no pod is created. The deploy goes green and ships nothing. Pinning the sha
# changes the pod template every commit, which is what actually triggers the
# rollout — and it makes a rollback an exact tag rather than a guess about what
# :latest pointed at.
#
# :latest still moves, so the existing promote-to-acc/prod path (which deploys
# :latest deliberately, build once and promote many) is unchanged.
#
# Promotion to test/acc/prod stays manual, via deploy-single-environment.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      # These cannot change what runs in the cluster, and a ten-minute deploy
      # for a README edit trains people to ignore the pipeline.
      - "ios/**"
      - "android/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Never two int deploys at once, and never cancel one midway: an interrupted
# helm upgrade leaves the release in pending-upgrade, which blocks the next one.
concurrency:
  group: fishers-cd-int
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # The brand list, from brands/. One place, so adding a brand file is the
  # whole of adding a brand — not a file plus four workflow edits, three of
  # which somebody remembers.
  brands:
    name: Which brands
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      space: ${{ steps.list.outputs.space }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          npm ci --omit=dev --prefix tools/brand
          echo "list=$(node tools/brand/index.mjs list --json)" >> "$GITHUB_OUTPUT"
          echo "space=$(node tools/brand/index.mjs list | tr '\n' ' ' | xargs)" >> "$GITHUB_OUTPUT"

  # DNS and the wslproxy vhost. Idempotent when credentials work. soft_fail so
  # a broken WSLPROXY_* secret cannot block shipping images to a ring whose
  # vhost already exists (www/int currently answer 200 while edge login 401s).
  # soft_fail is an input on the reusable workflow — continue-on-error is not
  # legal on a caller job that uses: another workflow.
  # Per brand, like the deploy. A brand whose DNS and vhost were never
  # registered deploys green and answers nobody: the edge has no idea what to
  # do with the Host header, so it serves the fallback vhost's self-signed
  # certificate, which reads as a broken app rather than as missing config.
  edge:
    name: DNS and edge vhost — ${{ matrix.brand }}
    needs: brands
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.brands.outputs.list) }}
    uses: ./.github/workflows/register-edge-vhost.yml
    with:
      ENV: int
      brand: ${{ matrix.brand }}
      soft_fail: true
    secrets: inherit

  build:
    name: Build images
    needs: brands
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ github.sha }}
      image_tag: latest
      # Every brand the matrix below deploys. The dashboard is built per brand
      # because the brand is baked into the bundle; the API is not, because it
      # is the same code pointed at a different database.
      brands: ${{ needs.brands.outputs.space }}
    secrets: inherit

  deploy:
    name: Deploy ${{ matrix.brand }} int
    needs: [brands, build, edge]
    # Ship whenever images built — edge is best-effort once the ring exists.
    if: always() && needs.build.result == 'success'
    # One deploy per brand. Each is its own namespace, its own API and its own
    # database, so they cannot interfere; fail-fast is off because one brand
    # being unhappy is not a reason to leave the other on yesterday's build.
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.brands.outputs.list) }}
    uses: ./.github/workflows/deploy-fishers-k3s.yml
    with:
      target_env: int
      brand: ${{ matrix.brand }}
      # The commit, not :latest — see the note above.
      image_tag: ${{ github.sha }}
      deploy_postgres: true
    secrets: inherit
