name: Auto Tag

# On every push to the default branch, cut the next patch release tag
# (vMAJOR.MINOR.PATCH+1) — same pattern as KubePilot.
#
# Notes:
#  - Pushing a tag with the default GITHUB_TOKEN does NOT re-trigger other
#    workflows that listen on tags (including iOS Release). To have tag pushes
#    fire ios_release.yml, add a repo secret RELEASE_PAT (contents: write) and
#    this workflow will use it for the tag push.
#  - TestFlight also runs directly on main pushes that touch ios/** (see
#    ios_release.yml), so RELEASE_PAT is optional for day-to-day TF uploads.
#  - Add `[skip tag]` to a commit message to skip tagging for that push.

on:
  push:
    branches: [main]

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: ${{ !contains(github.event.head_commit.message, '[skip tag]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute next patch tag
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1 | sed 's/^v//')"
          if [ -z "$latest" ]; then
            # Seed from MARKETING_VERSION in the iOS project when no tags exist.
            latest="$(awk '/MARKETING_VERSION:/{print $2; exit}' ios/project.yml 2>/dev/null || true)"
            latest="${latest:-1.0.0}"
          fi

          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"
          patch=$((patch + 1))
          next="v${major}.${minor}.${patch}"

          while git rev-parse -q --verify "refs/tags/${next}" >/dev/null; do
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          done

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${next} (base: ${latest})"

      - name: Create and push tag
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEXT}" -m "Release ${NEXT} (auto-bumped from ${GITHUB_SHA})"
          git push origin "${NEXT}"
          echo "Pushed ${NEXT}"
