name: iOS Release (TestFlight & App Store)

# Build, sign, and upload the native Fishers iOS app with fastlane — same shape as KubePilot.
#
#   AUTO (merge to main) : push to main touching ios/** or this workflow
#                          → fastlane ios beta → TestFlight (internal)
#   PRIMARY              : workflow_dispatch — TestFlight internal by default
#   SECONDARY            : push a v*.*.* tag (e.g. from auto-tag.yml) → TestFlight
#   APP STORE            : workflow_dispatch with target = app_store (after QA)
#
# Pipeline: ci_build_number → prepare_signing → build_ipa → beta
# Runner: self-hosted Mac Studio. Secrets: GitHub Actions or WSLVault
# kv/fishers/ios at https://vault.workstation.co.uk. See docs/IOS_RELEASE.md.
# Skip auto release with [skip release] or [skip ios].

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios_release.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (blank = ios/project.yml)"
        required: false
        default: ""
      target:
        description: "Upload destination"
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - app_store

concurrency:
  group: fishers-ios-release
  # Keep only the tip-of-main release when several ios/** merges land close together.
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  release:
    name: Build & upload (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testflight' }})
    if: >-
      github.event_name != 'push'
      || github.ref_type == 'tag'
      || (
        !contains(github.event.head_commit.message, '[skip release]')
        && !contains(github.event.head_commit.message, '[skip ios]')
      )
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      # WSLVault only — never vault.diytaxreturn.co.uk.
      VAULT_ADDR: https://vault.workstation.co.uk
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/wslvault/token.json
      FISHERS_IOS_VAULT_PATH: kv/fishers/ios
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build keychain
        run: |
          set -euo pipefail
          # Persist the signing keychain across runs on the self-hosted runner so
          # fastlane `cert` reuses one Apple Distribution certificate instead of
          # minting a new one each build (Apple caps distribution certs). The
          # password is generated once, kept off the repo and out of the logs.
          pass_file="$HOME/.secrets/fishers/keychain-password"
          mkdir -p "$(dirname "$pass_file")"
          if [ ! -s "$pass_file" ]; then
            ( umask 077; openssl rand -base64 24 > "$pass_file" )
          fi
          kc_pass="$(cat "$pass_file")"
          echo "::add-mask::$kc_pass"
          {
            echo "BUILD_KEYCHAIN_PATH=$HOME/Library/Keychains/fishers-signing.keychain-db"
            echo "BUILD_KEYCHAIN_PASSWORD=$kc_pass"
            echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Load signing secrets (GitHub secrets or WSLVault)
        env:
          # Prefer repo/org Actions secrets when present; otherwise the loader
          # reads kv/fishers/ios from https://vault.workstation.co.uk.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}
          CERT_PRIVATE_KEY_B64: ${{ secrets.CERT_PRIVATE_KEY_B64 }}
        run: |
          chmod +x ./ci/load-ios-vault-secrets.sh ./ci/seed-ios-vault.sh ./ci/verify-asc-api-key.rb
          # Prefer the AuthKey on the Mac Studio runner when it is a real PEM —
          # a non-PEM placeholder must not override ASC_PRIVATE_KEY_B64.
          if [ -z "${ASC_P8_PATH:-}" ]; then
            for candidate in \
              ${ASC_KEY_ID:+"$HOME/AuthKey_${ASC_KEY_ID}.p8"} \
              "$HOME/AuthKey_6KVVV27G4Q.p8"
            do
              [ -n "$candidate" ] && [ -f "$candidate" ] || continue
              if grep -q "BEGIN PRIVATE KEY" "$candidate" 2>/dev/null; then
                export ASC_P8_PATH="$candidate"
                break
              else
                echo "Ignoring non-PEM AuthKey at $candidate"
              fi
            done
          fi
          if [ -n "${ASC_P8_PATH:-}" ]; then
            echo "Using local ASC key file: $ASC_P8_PATH"
          fi
          ./ci/load-ios-vault-secrets.sh

      - name: Install Ruby dependencies
        run: |
          set -euo pipefail
          # Prefer Ruby 3.3 when present — fastlane is happier than on Homebrew
          # Ruby 4.x. Fall back to whatever `ruby` is on PATH.
          if [ -x /opt/homebrew/opt/ruby@3.3/bin/ruby ]; then
            export PATH="/opt/homebrew/opt/ruby@3.3/bin:$PATH"
          elif [ -x /opt/homebrew/opt/ruby@3.2/bin/ruby ]; then
            export PATH="/opt/homebrew/opt/ruby@3.2/bin:$PATH"
          fi
          echo "Using $(command -v ruby) ($(ruby -v))"
          # Mac Homebrew may still be on Ruby 4.x; Gemfile.lock used to pin
          # Bundler 1.17.2 which crashes (String#untaint removed). Force 2.5+.
          gem install bundler -v '~> 2.5' --no-document
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4
          {
            echo "PATH=$PATH"
          } >> "$GITHUB_ENV"

      - name: Verify App Store Connect API key
        run: bundle exec ruby ./ci/verify-asc-api-key.rb

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="$(awk '/MARKETING_VERSION:/{print $2; exit}' project.yml)"
          fi
          echo "Resolved version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Compute next build number
        id: build
        run: bundle exec fastlane ios ci_build_number

      - name: Prepare code signing
        run: bundle exec fastlane ios prepare_signing

      - name: Build signed IPA
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload to TestFlight (internal)
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'testflight')
        run: bundle exec fastlane ios beta

      - name: Submit for App Store review
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        run: bundle exec fastlane ios release

      - name: Archive IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishers-ios-ipa
          path: ios/build/Fishers.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          # The signing keychain is intentionally persistent (see Configure build
          # keychain) — lock it rather than delete it so the cert survives.
          security lock-keychain "$BUILD_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true
          rm -f "${ASC_KEY_FILEPATH:-}" "${DIST_CERT_KEY_FILEPATH:-}" 2>/dev/null || true
          rm -f "${INSTALLED_PROFILE_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/.ios-secrets" "${IOS_SECRETS_DIR:-}" 2>/dev/null || true
