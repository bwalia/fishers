name: Deploy Fishers (K3s)

# Installs one ring, every part of it through Helm:
#
#   secrets  -> kv/fishers/<ring>/config in WSLVault, synced by an
#               ExternalSecret. Everything below reads it, so it goes first and
#               the deploy stops here — naming the vault path and the missing
#               keys — if the ring has not been configured.
#   db       -> Postgres, run by the Zalando operator. It generates the owner's
#               password itself, so there is no database password in the
#               vault, in CI, or in any helm release.
#   minio    -> uploads. Its root credentials are the API's S3 keys, from the
#               same Secret, so the two cannot drift.
#   api      -> readiness touches the pool, so it has to come after the db or
#               it never goes Ready. The web chart's ingress routes /api here.
#   web      -> owns the ingress for the host (/, /api, /media), so it goes
#               last: an ingress whose backend does not exist yet answers 503.
#
# Standing up a new ring (test/acc/prod) is: put its values at
# kv/fishers/<ring>/config (scripts/vault-seed-ring.sh generates the random
# ones), then run "Deploy Single Environment" for that ring. Nothing else.

on:
  workflow_call:
    inputs:
      target_env:
        description: "int | test | acc | prod"
        type: string
        required: true
      image_tag:
        type: string
        required: false
        default: latest
      registry_provider:
        type: string
        required: false
        default: NEBULACR
      deploy_postgres:
        description: "Install/upgrade the ring's Zalando Postgres cluster."
        type: boolean
        required: false
        default: true
    # Only what it takes to reach the cluster and pull images. Every
    # application secret is in the vault.
    secrets:
      MY_K3S1_CONFIG:        { required: true }
      NEBULACR_REGISTRY:     { required: false }
      NEBULACR_USERNAME:     { required: false }
      NEBULACR_PASSWORD:     { required: false }
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        required: true
        default: int
        options: [int, test, acc, prod]
      image_tag:
        type: string
        required: false
        default: latest
      registry_provider:
        type: choice
        required: false
        default: NEBULACR
        options: [NEBULACR, GHCR]
      deploy_postgres:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: fishers-deploy-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      CHARTS: devops/helm-charts
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ring
        id: ring
        run: |
          set -euo pipefail
          # One host per ring; the ingress splits / and /api behind it.
          case "$TARGET_ENV" in
            int)  HOSTNAME=int.fishers.cloud  ;;
            test) HOSTNAME=test.fishers.cloud ;;
            acc)  HOSTNAME=acc.fishers.cloud  ;;
            prod) HOSTNAME=www.fishers.cloud  ;;
            *) echo "::error::unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac
          # Namespace per ring. `fishers-prod` rather than `prod` so this does
          # not collide with another project's namespace on a shared cluster.
          echo "namespace=fishers-$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "hostname=$HOSTNAME"            >> "$GITHUB_OUTPUT"

          case "${{ inputs.registry_provider || 'NEBULACR' }}" in
            GHCR) echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
                  echo "ns=ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT" ;;
            # See build-images.yml: the NEBULACR_* secrets hold spectoncr
            # credentials, and this must stay the host CI pushed to.
            *)    REG="${{ secrets.NEBULACR_REGISTRY || 'int-spectoncr.diytaxreturn.co.uk' }}"
                  echo "registry=$REG"       >> "$GITHUB_OUTPUT"
                  echo "ns=$REG/fishers"     >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up kubectl and helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MY_K3S1_CONFIG }}" ]; then
            echo "::error::MY_K3S1_CONFIG is not set on this repository."
            exit 1
          fi
          echo "${{ secrets.MY_K3S1_CONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          set -euo pipefail
          # Read the class the chart will actually ask for rather than repeating
          # it here — a preflight that checks a different value than the deploy
          # uses is worse than no preflight.
          INGRESS_CLASS=$(helm template fishers-web "$CHARTS/fishers-web" \
              -f "$CHARTS/fishers-web/values.yaml" \
              -f "$CHARTS/fishers-web/values-$TARGET_ENV.yaml" \
              --set hostname=preflight.invalid \
            | awk '/ingressClassName:/ {print $2; exit}')
          [ -n "$INGRESS_CLASS" ] || { echo "::error::could not read ingressClassName from the web chart."; exit 1; }
          echo "chart asks for IngressClass: $INGRESS_CLASS"
          # Everything here is a precondition the charts assume. Checked up
          # front and named, because each one otherwise fails much later and
          # much less legibly: a missing IngressClass produces an Ingress that
          # no controller ever picks up (the host simply never answers, with
          # nothing in any log saying why), and a missing StorageClass leaves
          # the Postgres PVC Pending until helm --wait times out on what looks
          # like a slow database.
          kubectl version -o yaml >/dev/null
          echo "--- nodes ---"
          kubectl get nodes -o wide

          fail=0

          echo "--- ingress classes ---"
          kubectl get ingressclass -o custom-columns=NAME:.metadata.name,CONTROLLER:.spec.controller --no-headers || true
          if ! kubectl get ingressclass "$INGRESS_CLASS" >/dev/null 2>&1; then
            echo "::error::IngressClass '$INGRESS_CLASS' does not exist on this cluster."
            echo "::error::The charts set ingress.ingressClassName=$INGRESS_CLASS. Either install that controller,"
            echo "::error::or set ingress.ingressClassName in devops/helm-charts/fishers-web/values-*.yaml to one listed above."
            fail=1
          else
            echo "  ok  IngressClass $INGRESS_CLASS"
          fi

          # Read what the charts will ask for, not a copy of it here.
          DB_SC=$(awk '/^  storageClass:/ {print $2; exit}' "$CHARTS/fishers-db/values.yaml")
          MINIO_SC=$(awk '/^  storageClass:/ {print $2; exit}' "$CHARTS/fishers-minio/values.yaml")
          STORE=$(awk '/^  name:/ {print $2; exit}' "$CHARTS/fishers-secrets/values.yaml")

          echo "--- storage classes ---"
          kubectl get storageclass --no-headers -o custom-columns=NAME:.metadata.name,PROVISIONER:.provisioner || true
          for sc in $(printf '%s\n' "$DB_SC" "$MINIO_SC" | sort -u); do
            if kubectl get storageclass "$sc" >/dev/null 2>&1; then
              echo "  ok  StorageClass $sc"
            else
              echo "::error::StorageClass '$sc' (named by fishers-db / fishers-minio values) does not exist on this cluster."
              fail=1
            fi
          done

          echo "--- Zalando postgres-operator ---"
          if kubectl get crd postgresqls.acid.zalan.do >/dev/null 2>&1; then
            echo "  ok  postgresqls.acid.zalan.do"
          else
            echo "::error::the Zalando postgres-operator is not installed — fishers-db is a postgresql resource it reconciles."
            fail=1
          fi

          echo "--- secret store ---"
          ready=$(kubectl get clustersecretstore "$STORE" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
          if [ "$ready" = "True" ]; then
            echo "  ok  ClusterSecretStore $STORE"
          else
            echo "::error::ClusterSecretStore '$STORE' is missing or not Ready — every ring's secrets come from it."
            fail=1
          fi

          exit $fail

      - name: Ensure namespace and registry pull secret
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "${{ secrets.NEBULACR_USERNAME }}" ]; then
            kubectl create secret docker-registry fishers-registry \
              --docker-server="${{ steps.ring.outputs.registry }}" \
              --docker-username="${{ secrets.NEBULACR_USERNAME }}" \
              --docker-password="${{ secrets.NEBULACR_PASSWORD }}" \
              --namespace "$NS" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::notice::no registry credentials — assuming the images are public or the secret already exists."
          fi

      - name: Sync secrets from the vault
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          VAULT_PATH="kv/fishers/$TARGET_ENV/config"
          helm upgrade --install fishers-secrets "$CHARTS/fishers-secrets" \
            --namespace "$NS" \
            -f "$CHARTS/fishers-secrets/values.yaml" \
            --set env="$TARGET_ENV"

          # Force a fresh read. ESO otherwise waits out its refresh interval,
          # so a value changed in the vault a minute ago would roll out as the
          # old one. "Fresh" is judged by refreshTime CHANGING, not by
          # comparing it with this runner's clock, which is not the cluster's.
          before=$(kubectl -n "$NS" get externalsecret fishers-secrets -o jsonpath='{.status.refreshTime}' 2>/dev/null || true)
          kubectl -n "$NS" annotate externalsecret fishers-secrets force-sync="$(date +%s)" --overwrite >/dev/null
          synced=0
          for _ in $(seq 1 45); do
            now=$(kubectl -n "$NS" get externalsecret fishers-secrets -o jsonpath='{.status.refreshTime}' 2>/dev/null || true)
            ready=$(kubectl -n "$NS" get externalsecret fishers-secrets -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            if [ -n "$now" ] && [ "$now" != "$before" ] && [ "$ready" = "True" ]; then synced=1; break; fi
            sleep 2
          done
          if [ "$synced" != 1 ]; then
            msg=$(kubectl -n "$NS" get externalsecret fishers-secrets -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || true)
            echo "::error::could not read $VAULT_PATH from the vault: ${msg:-no status yet}"
            echo "::error::Create it with: scripts/vault-seed-ring.sh $TARGET_ENV"
            exit 1
          fi
          echo "  synced $VAULT_PATH"

          # The keys every ring needs. Optional integrations (Stripe,
          # Anthropic) are simply absent where unused, so they are not checked.
          have=$(kubectl -n "$NS" get secret fishers-secrets -o json | jq -r '.data | keys[]')
          missing=""
          for k in JWT_SECRET S3_ACCESS_KEY S3_SECRET_KEY; do
            grep -qx "$k" <<<"$have" || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::$VAULT_PATH is missing:$missing"
            echo "::error::scripts/vault-seed-ring.sh $TARGET_ENV adds the missing ones and never overwrites existing keys."
            exit 1
          fi
          # A short signing key makes every token on the ring forgeable.
          jwt_len=$(kubectl -n "$NS" get secret fishers-secrets -o jsonpath='{.data.JWT_SECRET}' | base64 -d | wc -c)
          if [ "$jwt_len" -lt 32 ]; then
            echo "::error::JWT_SECRET at $VAULT_PATH is $jwt_len bytes; use at least 32."
            exit 1
          fi
          echo "  keys: $(tr '\n' ' ' <<<"$have")"

      - name: Deploy database (Zalando)
        if: ${{ inputs.deploy_postgres }}
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          helm upgrade --install fishers-db "$CHARTS/fishers-db" \
            --namespace "$NS" \
            -f "$CHARTS/fishers-db/values.yaml" \
            -f "$CHARTS/fishers-db/values-$TARGET_ENV.yaml"

          # The operator reports on the postgresql resource, not through helm,
          # so --wait has nothing to wait on. Wait for Running AND for the
          # credentials Secret the API reads: the cluster can report Running a
          # moment before the operator has written it.
          CLUSTER=$(awk '/^clusterName:/ {print $2; exit}' "$CHARTS/fishers-db/values.yaml")
          OWNER=$(awk '/^owner:/ {print $2; exit}' "$CHARTS/fishers-db/values.yaml")
          CREDS="$OWNER.$CLUSTER.credentials.postgresql.acid.zalan.do"
          for i in $(seq 1 60); do
            status=$(kubectl -n "$NS" get postgresql "$CLUSTER" -o jsonpath='{.status.PostgresClusterStatus}' 2>/dev/null || true)
            if [ "$status" = "Running" ] && kubectl -n "$NS" get secret "$CREDS" >/dev/null 2>&1; then
              echo "  ok  $CLUSTER Running, credentials in $CREDS"
              exit 0
            fi
            [ $((i % 6)) -eq 0 ] && echo "  waiting for $CLUSTER (status: ${status:-none})"
            sleep 10
          done
          echo "::error::$CLUSTER did not reach Running within 10 minutes (status: ${status:-none})"
          kubectl -n "$NS" describe postgresql "$CLUSTER" | tail -20 || true
          kubectl -n "$NS" get pods -l cluster-name="$CLUSTER" -o wide || true
          exit 1

      - name: Deploy MinIO
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          # --wait also waits for the post-install hook that creates the bucket
          # and opens it for anonymous download.
          helm upgrade --install fishers-minio "$CHARTS/fishers-minio" \
            --namespace "$NS" \
            -f "$CHARTS/fishers-minio/values.yaml" \
            -f "$CHARTS/fishers-minio/values-$TARGET_ENV.yaml" \
            --wait --timeout 10m

      - name: Deploy API
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          # --wait blocks on readiness, and readiness here means the pool
          # answers — so a green step means the schema migrated and the
          # database is reachable over TLS, not just that a pod started.
          # No credentials on this command line: they come from the vault and
          # the operator. rolloutId rolls the pods every deploy, so a vault
          # change lands even when the image tag has not moved.
          helm upgrade --install fishers-api "$CHARTS/fishers-api" \
            --namespace "$NS" \
            -f "$CHARTS/fishers-api/values.yaml" \
            -f "$CHARTS/fishers-api/values-$TARGET_ENV.yaml" \
            --set image.repository='${{ steps.ring.outputs.ns }}/fishers-api' \
            --set image.tag="$IMAGE_TAG" \
            --set hostname='${{ steps.ring.outputs.hostname }}' \
            --set rolloutId='${{ github.run_id }}-${{ github.run_attempt }}' \
            --wait --timeout 10m

      - name: Deploy dashboard
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          helm upgrade --install fishers-web "$CHARTS/fishers-web" \
            --namespace "$NS" \
            -f "$CHARTS/fishers-web/values.yaml" \
            -f "$CHARTS/fishers-web/values-$TARGET_ENV.yaml" \
            --set image.repository='${{ steps.ring.outputs.ns }}/fishers-web' \
            --set image.tag="$IMAGE_TAG" \
            --set hostname='${{ steps.ring.outputs.hostname }}' \
            --set rolloutId='${{ github.run_id }}-${{ github.run_attempt }}' \
            --wait --timeout 10m

      - name: Smoke test from inside the cluster
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          set -euo pipefail
          # In-cluster, so this passes or fails on the deploy alone — before
          # DNS, the edge or a certificate can be blamed for it. The public
          # check is Ring Promoter's health_url, which comes after.
          fail=0
          # Exit code, not grepped output: kubectl run propagates the container's
          # status, and curl -f already fails on any non-2xx. Matching on stdout
          # would also match the pod-lifecycle chatter kubectl interleaves with it.
          probe() { # name url
            if kubectl run "smoke-$1-$RANDOM" --rm -i --restart=Never --namespace "$NS" \
                 --image=curlimages/curl:8.10.1 --quiet --command -- \
                 curl -fsS -m 10 -o /dev/null "$2"; then
              echo "  ok   $1"
            else
              echo "  FAIL $1 ($2)"; fail=1
            fi
          }
          probe api-ready   "http://fishers-api:8080/health/ready"
          probe web-login   "http://fishers-web:80/login"
          probe minio-ready "http://fishers-minio:9000/minio/health/ready"
          exit $fail

      - name: Reachable from outside
        env:
          HOST: ${{ steps.ring.outputs.hostname }}
        run: |
          set -uo pipefail
          # The other half of the edge check, in the only job that can make it
          # true. register-edge-vhost.yml registers the vhost but cannot assert
          # the app answers — the app is installed here, and that job runs
          # before this one — so it warns and this decides.
          #
          # Generous, because the first deploy of a ring is the slow one: the
          # vhost reaches pop0 on a config sync, and then a brand-new Let's
          # Encrypt certificate has to be issued before curl will speak to it at
          # all. A redeploy passes on the first attempt.
          for i in $(seq 1 40); do
            : > /tmp/ext
            code=$(curl -sS -o /tmp/ext -m 10 -w '%{http_code}' "https://${HOST}/health" || echo 000)
            body=$(tr -d '[:space:]' < /tmp/ext)
            # "ok" is what the API's own handler returns. The edge answers its
            # own pages with 200 too, so the status alone proves nothing.
            if [ "$code" = "200" ] && [ "$body" = "ok" ]; then
              echo "  ok   https://${HOST}/health after ${i} attempt(s)"
              exit 0
            fi
            echo "  [$i] https://${HOST}/health -> $code $(head -c 60 /tmp/ext | tr -d '\n')"
            sleep 15
          done
          echo "::error::${HOST} never served the app through the edge. The release is in the cluster — the in-cluster smoke test passed — so this is DNS, the wslproxy vhost, or its certificate."
          echo "::error::Check: dig ${HOST}; curl -vI https://${HOST}/health; and the vhost in devops/wslproxy/host-${HOST}.json."
          exit 1

      - name: Report
        if: always()
        env:
          NS: ${{ steps.ring.outputs.namespace }}
        run: |
          {
            echo "### Fishers — $TARGET_ENV"
            echo "- host: https://${{ steps.ring.outputs.hostname }}"
            echo "- namespace: \`$NS\`"
            echo "- image tag: \`$IMAGE_TAG\`"
            echo
            echo '```'
            kubectl get postgresql,externalsecret,deploy,statefulset,svc,ingress -n "$NS" 2>&1 | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
