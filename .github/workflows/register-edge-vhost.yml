name: Register edge vhost (Cloudflare + wslproxy)

# Makes a ring publicly reachable: a Cloudflare CNAME to the edge, and a
# wslproxy vhost so the edge knows what to do with the Host header. Until the
# vhost exists the edge answers "Host not configured", which looks like a
# broken deploy but is not one.
#
# Idempotent and safe to re-run: the CNAME is upserted, and an existing vhost
# is left alone rather than recreated.
#
# Run once per ring when it is first stood up, and again only if the edge
# configuration is lost. Day to day, DNS is maintained by ExternalDNS from the
# ingress annotation, with cloudflare-dns-reconcile.yml as the backstop.

on:
  # Called by the CD pipeline before it deploys, so a ring that has never been
  # stood up gets its DNS and vhost in the same run that first deploys it.
  # Both steps are idempotent, so running this on every push costs a few
  # seconds and removes a manual prerequisite that is only ever noticed when
  # somebody forgets it.
  workflow_call:
    inputs:
      ENV:
        description: "Ring to register (or `all`)"
        type: string
        required: true

  workflow_dispatch:
    inputs:
      ENV:
        description: "Ring to register (or `all`)"
        type: choice
        required: true
        default: all
        options: [all, int, test, acc, prod]
      DEPLOY_BRANCH:
        description: "Reserved — Ring Promoter passes this; ignored."
        type: string
        required: false
        default: main
      DEPLOY_MODE:
        description: "Reserved — ignored."
        type: string
        required: false
        default: full

env:
  CNAME_TARGET: lon1.pop0.uk
  ZONE: fishers.cloud

permissions:
  contents: read

jobs:
  register:
    name: Register ${{ inputs.ENV }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve hosts
        id: hosts
        run: |
          set -euo pipefail
          case "${{ inputs.ENV }}" in
            int)  HOSTS="int.fishers.cloud" ;;
            test) HOSTS="test.fishers.cloud" ;;
            acc)  HOSTS="acc.fishers.cloud" ;;
            prod) HOSTS="www.fishers.cloud fishers.cloud" ;;
            all)  HOSTS="int.fishers.cloud test.fishers.cloud acc.fishers.cloud www.fishers.cloud fishers.cloud" ;;
            *) echo "::error::unknown ring '${{ inputs.ENV }}'"; exit 1 ;;
          esac
          # The bare domain is an A record at the zone apex, pointed at the edge
          # already. A CNAME cannot coexist with it, so Cloudflare would refuse
          # the upsert below and take the whole deploy down with it — the apex
          # needs the vhost (for its own certificate) and nothing else.
          DNS_HOSTS=$(echo "$HOSTS" | tr ' ' '\n' | grep -vx 'fishers.cloud' | tr '\n' ' ')
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"
          echo "dns_hosts=$DNS_HOSTS" >> "$GITHUB_OUTPUT"
          echo "Registering vhosts: $HOSTS"
          echo "Registering DNS:    ${DNS_HOSTS:-none}"

      - name: Ensure Cloudflare CNAMEs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTS: ${{ steps.hosts.outputs.dns_hosts }}
        run: |
          set -euo pipefail
          # Soft-skip without a token: ExternalDNS normally owns these records,
          # and this step is the belt-and-braces, not the primary write path.
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — leaving DNS to ExternalDNS."
            exit 0
          fi
          if [ -z "${HOSTS// /}" ]; then
            echo "::notice::nothing here needs a CNAME."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
          zone_id=$(curl -fsS "${auth[@]}" "$api/zones?name=${ZONE}" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::zone ${ZONE} not visible to this Cloudflare token."
            exit 1
          fi
          for HOST in $HOSTS; do
            rec_id=$(curl -fsS "${auth[@]}" \
              "$api/zones/$zone_id/dns_records?type=CNAME&name=${HOST}" \
              | jq -r '.result[0].id // empty')
            # proxied:false — the wslproxy edge terminates TLS and issues the
            # certificate itself. Proxying through Cloudflare as well would put
            # a second terminator in front of it and break the ACME http-01
            # challenge the vhost renews with.
            body=$(jq -nc --arg name "$HOST" --arg content "$CNAME_TARGET" \
              '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')
            if [ -n "$rec_id" ]; then
              curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$rec_id" --data "$body" >/dev/null
              echo "  updated CNAME ${HOST} -> ${CNAME_TARGET}"
            else
              curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$body" >/dev/null
              echo "  created CNAME ${HOST} -> ${CNAME_TARGET}"
            fi
          done

      - name: Import wslproxy rules and vhosts
        env:
          WSLPROXY_USER: ${{ secrets.WSLPROXY_USER }}
          WSLPROXY_PASSWORD: ${{ secrets.WSLPROXY_PASSWORD }}
          WSLPROXY_GATEWAY_URL: ${{ secrets.WSLPROXY_GATEWAY_URL }}
          HOSTS: ${{ steps.hosts.outputs.hosts }}
        run: |
          set -euo pipefail
          if [ -z "${WSLPROXY_USER:-}" ] || [ -z "${WSLPROXY_PASSWORD:-}" ] || [ -z "${WSLPROXY_GATEWAY_URL:-}" ]; then
            echo "::error::WSLPROXY_USER / WSLPROXY_PASSWORD / WSLPROXY_GATEWAY_URL must all be set."
            exit 1
          fi
          GW="$WSLPROXY_GATEWAY_URL"
          TOKEN=$(curl -fsS -X POST "$GW/api/user/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg e "$WSLPROXY_USER" --arg p "$WSLPROXY_PASSWORD" '{email:$e,password:$p}')" \
            | jq -r '.data.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::wslproxy login failed for ${WSLPROXY_USER} at ${GW}."; exit 1
          fi

          # Collect this ring's vhosts, checking each names the host it claims
          # to be — a copy-paste otherwise puts one ring's config on another's
          # hostname.
          SPECS=""
          for HOST in $HOSTS; do
            SPEC="devops/wslproxy/host-${HOST}.json"
            [ -f "$SPEC" ] || { echo "::error::missing spec $SPEC"; exit 1; }
            spec_host=$(jq -r '.server_name' "$SPEC")
            [ "$spec_host" = "$HOST" ] || { echo "::error::$SPEC server_name=$spec_host != $HOST"; exit 1; }
            SPECS="$SPECS $SPEC"
          done

          # Every vhost names a rule in its `rules` array, and that rule has to
          # exist on the gateway or the vhost has no backend to proxy to: the
          # admin UI reports "Could not load rule details" and the edge serves
          # its Access denied page, which reads as a broken app rather than as
          # missing edge config.
          #
          # /api/projects/import, not POST /api/rules: import keys records on
          # the id in the file, so `fishers-prod-default` stays the id the
          # vhosts reference. A plain POST mints a fresh UUID and silently
          # breaks that link. It is also an upsert, so a committed spec that
          # changes actually reaches the gateway — the previous create-or-skip
          # meant an existing vhost was never updated again.
          #
          # dataType must be plural: the gateway builds its write path straight
          # from it (data/<dataType>/<profile_id>/) and reads vhosts back from
          # data/servers/<profile>/host:<host>.json.
          import() {
            local dtype="$1" arr="$2" body resp code
            body=$(jq -cn --argjson data "$arr" --arg dt "$dtype" '{data: $data, dataType: $dt}')
            resp=$(curl -sS --max-time 60 -w "\n%{http_code}" \
              -X POST "${GW%/}/api/projects/import?_format=json" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-platform: react-admin" \
              -H "Content-Type: application/json" \
              --data-raw "$body")
            code=$(echo "$resp" | tail -n1)
            echo "  dataType=$dtype -> HTTP $code"
            case "$code" in
              200|201) ;;
              *) echo "$resp" | sed '$d'; echo "::error::import of $dtype failed (HTTP $code)"; return 1 ;;
            esac
          }

          # Rules first, so the vhosts' references resolve the moment they land.
          RULES_ARR=$(jq -s '.' devops/wslproxy/rule-*.json)
          echo "Importing $(echo "$RULES_ARR" | jq 'length') rule(s): $(echo "$RULES_ARR" | jq -r '[.[].id] | join(", ")')"
          import rules "$RULES_ARR"

          # shellcheck disable=SC2086
          SERVERS_ARR=$(jq -s '.' $SPECS)
          echo "Importing $(echo "$SERVERS_ARR" | jq 'length') vhost(s): $(echo "$SERVERS_ARR" | jq -r '[.[].server_name] | join(", ")')"
          import servers "$SERVERS_ARR"

      - name: Verify through the edge
        env:
          HOSTS: ${{ steps.hosts.outputs.hosts }}
        run: |
          set -euo pipefail
          # pop0 picks up a new vhost within about a minute via its config sync,
          # and a fresh certificate takes a little longer still.
          fail=0
          for HOST in $HOSTS; do
            ok=0
            for i in $(seq 1 20); do
              code=$(curl -sS -o /tmp/body -m 10 -w '%{http_code}' "https://${HOST}/health" || echo 000)
              # Assert what the API serves, not the absence of one known error
              # string. wslproxy answers its own pages with 200, so a vhost with
              # no working rule returned 200 "Access denied" and passed a check
              # that only looked for "Host not configured" — the edge was broken
              # and this step was green for it.
              #
              # The API's /health handler returns exactly "ok", so matching that
              # proves the request reached the app rather than merely reaching
              # the edge.
              body=$(tr -d '[:space:]' < /tmp/body)
              if [ "$code" = "200" ] && [ "$body" = "ok" ]; then
                echo "  ok   https://${HOST}/health"; ok=1; break
              fi
              echo "  [$i] https://${HOST}/health -> $code $(head -c 60 /tmp/body | tr -d '\n')"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "  FAIL ${HOST} never answered through the edge"; fail=1; }
          done
          exit $fail
