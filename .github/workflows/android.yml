name: Android

# Analyze, test and build the Flutter app on every change to it.
#
# The Dart half (analyze + test) needs no Android SDK and runs in seconds; the
# Gradle half needs the SDK and is the only thing here that can catch a broken
# manifest, a bad minSdk or a plugin that will not build. Both matter: the Dart
# tests are the fast signal, the APK is the honest one.
#
# Release and Play upload live in android_release.yml.

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: fishers-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: flutter

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --set-exit-if-changed, because "formatted 3 files" in a log nobody reads
      # is not a check. Fails the build, names the files.
      - name: Check formatting
        run: dart format --line-length 100 --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: warn

  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Only worth the Gradle cold start once the Dart side is green.
    needs: [dart]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug, not release: this job has no keystore and is not meant to have
      # one. It proves the Android half compiles, links and packages — which is
      # everything the Dart tests cannot tell you.
      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: fishers-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
