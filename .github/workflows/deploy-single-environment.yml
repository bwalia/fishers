name: "Deploy Single Environment (build from ref + deploy one ring)"

# The entry point Ring Promoter dispatches, one ring at a time.
#
# Input names are the Ring Promoter github deployer's defaults, so the promoter
# needs no per-input overrides:
#   ENV           <- ring target_env      (int | test | acc | prod)
#   DEPLOY_BRANCH <- the promoted version (git ref to build and deploy)
#   DEPLOY_MODE   <- reserved             ("full" = build + deploy)
#   brand         <- extra_inputs.brand   (fishers | gullycricket)
#
# One registered app per brand, both pointed here: Ring Promoter promotes one
# stack through one pipeline, and a brand IS a stack — own namespace, own
# database, own vault path, own dashboard image. Nothing below is shared
# between two brands except the API binary.
#
# Build once, promote many. int and test build images from the given ref; acc
# and prod do not build at all — they deploy an image those builds already
# pushed. Rebuilding for production would ship an artefact nobody tested, from
# source that only probably matches.
#
# Every ring deploys one exact commit, never :latest. The ref is resolved to a
# sha once, up front, and that sha is the image tag. :latest was a moving
# target: prod's two web pods once pulled it seconds apart and came up on two
# different builds, and there was no way to say what "roll back" meant. A sha
# changes the pod template on every deploy, so the rollout always happens, and
# rolling back is running this again with the previous sha.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      ENV:
        description: "Ring to deploy (one only)"
        type: choice
        required: true
        default: "int"
        options: [int, test, acc, prod]
      DEPLOY_BRANCH:
        description: "Git ref to build and deploy (branch/tag/sha)"
        type: string
        required: true
        default: "main"
      DEPLOY_MODE:
        description: "Reserved. 'full' = build + deploy."
        type: string
        required: false
        default: "full"
      brand:
        description: >-
          Which brand in brands/ to promote. Each is a whole stack — its own
          namespace, its own API, its own database, its own vault path — so
          this picks the deployment, not a skin on a shared one. Ring Promoter
          sends it as a static extra_input, one registered app per brand.
          A free-form string rather than a choice: the brand list lives in
          brands/ and a dispatch input cannot read it, so a hard-coded list
          here would be a third place to remember. An unknown brand stops at
          the brand tool with "no such brand".
        type: string
        required: false
        default: "fishers"
      REGISTRY_PROVIDER:
        description: "Container registry"
        type: choice
        required: false
        default: "NEBULACR"
        options: [NEBULACR, GHCR]

# Per brand as well as per ring: two brands are two namespaces, two databases
# and two helm releases, so promoting one has nothing to serialise against the
# other. Sharing a lock would make a GullyCricket promote wait out a Fishers
# one for no reason.
concurrency:
  group: single-env-deploy-${{ github.event.inputs.brand || 'fishers' }}-${{ github.event.inputs.ENV }}
  cancel-in-progress: false

jobs:
  # The ref becomes one commit here, so a merge landing mid-deploy cannot change
  # what ships. For acc and prod it must also be a commit that has images.
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.DEPLOY_BRANCH }}
          # Enough history to step back past a run of docs-only merges.
          fetch-depth: 50

      - name: Pick the commit to deploy
        id: pick
        env:
          RING: ${{ github.event.inputs.ENV }}
          BRAND: ${{ github.event.inputs.brand || 'fishers' }}
          PROVIDER: ${{ github.event.inputs.REGISTRY_PROVIDER || 'NEBULACR' }}
          NEBULA_HOST: ${{ secrets.NEBULACR_REGISTRY || 'int-spectoncr.diytaxreturn.co.uk' }}
          NEBULA_USER: ${{ secrets.NEBULACR_USERNAME }}
          NEBULA_PASS: ${{ secrets.NEBULACR_PASSWORD }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # The registry is the only thing that knows whether a commit was
          # ever built, so ask it before deciding anything — including for int
          # and test, which used to build unconditionally.
          #
          # Tolerated here rather than fatal: a ring whose registry credentials
          # are missing can still have int and test build the commit
          # themselves, which is what they did before this check existed. acc
          # and prod cannot, and say so below.
          if [ "$PROVIDER" = GHCR ]; then
            HOST=ghcr.io; NS="ghcr.io/${{ github.repository_owner }}"
            echo "$GHCR_PASS" | docker login "$HOST" -u "${{ github.actor }}" --password-stdin >/dev/null && LOGGED_IN=1 || LOGGED_IN=0
          else
            HOST="$NEBULA_HOST"; NS="$HOST/fishers"
            echo "$NEBULA_PASS" | docker login "$HOST" -u "$NEBULA_USER" --password-stdin >/dev/null && LOGGED_IN=1 || LOGGED_IN=0
          fi
          # The API image is shared — one binary, pointed at each brand's own
          # database — but the dashboard is not: the brand is baked into the
          # bundle, so it is built and named per brand. Asking for fishers-web
          # here would have let a GullyCricket promote to acc or prod pass this
          # gate on Fishers' build and then pull an image nothing had pushed.
          built() {
            [ "$LOGGED_IN" = 1 ] || return 1
            docker manifest inspect "$NS/fishers-api:$1" >/dev/null 2>&1 &&
              docker manifest inspect "$NS/$BRAND-web:$1" >/dev/null 2>&1
          }

          # int and test build the commit themselves — unless it is already
          # built, which on main it almost always is: cd-int builds every
          # merge. Rebuilding it pushed the identical image a second time and,
          # worse, queued behind whatever build was already running, which is
          # how one promote came to cancel another.
          #
          # "Build once, promote many" is what the top of this file says; this
          # is int and test finally obeying it too.
          if [ "$RING" = int ] || [ "$RING" = test ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            if built "$SHA"; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              summary "Deploying \`$SHA\` to **$BRAND $RING** — already built, so this promotes that image rather than making another."
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
              summary "Deploying \`$SHA\` to **$BRAND $RING** (no images for it yet, so this run builds them)."
            fi
            exit 0
          fi

          if [ "$LOGGED_IN" != 1 ]; then
            echo "::error::could not sign in to $HOST, so there is no way to tell whether $SHA was ever built."
            echo "::error::$RING deploys an existing image and will not guess. Check NEBULACR_USERNAME / NEBULACR_PASSWORD (or GHCR_TOKEN)."
            exit 1
          fi

          # A merge that only touches docs, markdown or the iOS app builds
          # nothing (cd-int ignores those paths), so the newest commit on main
          # can have no images of its own. Step back over exactly those commits
          # — and nothing else: a commit that changes what runs and has no
          # images is a failed or unfinished build, and deploying the one before
          # it would quietly ship something other than what was asked for.
          PICK="$SHA"
          until built "$PICK"; do
            RUNS=$(git diff --name-only "$PICK^1" "$PICK" | grep -v -E '^(ios|docs)/|\.md$' || true)
            if [ -n "$RUNS" ]; then
              echo "::error::No images for $PICK, and it changes what runs:"
              echo "$RUNS" | head -20 | sed 's/^/  /'
              echo "::error::Let its int build finish (CD — deploy int on merge to main), or deploy it to int or test first."
              exit 1
            fi
            PREV=$(git rev-parse --verify -q "$PICK^1") || {
              echo "::error::No built commit within the last 50 behind $SHA."; exit 1; }
            echo "$PICK changes only docs/iOS — stepping back to $PREV"
            PICK="$PREV"
          done

          echo "sha=$PICK" >> "$GITHUB_OUTPUT"
          # acc and prod never build: the loop above only ends on a commit the
          # registry already has.
          echo "build=false" >> "$GITHUB_OUTPUT"
          summary "Deploying \`$PICK\` to **$BRAND $RING**: $(git log -1 --format=%s "$PICK")"
          [ "$PICK" = "$SHA" ] || summary "(\`$SHA\` was asked for; the commits after \`$PICK\` change only docs or the iOS app.)"
          summary ""
          summary "Roll back by running this workflow for $BRAND $RING with an earlier sha."

  # DNS and the wslproxy vhost + rule for this ring. soft_fail: a bad
  # WSLPROXY_* secret must not block helm when the vhost already exists.
  # (continue-on-error is illegal on a uses: caller job — see register-edge.)
  edge:
    uses: ./.github/workflows/register-edge-vhost.yml
    with:
      ENV: ${{ github.event.inputs.ENV }}
      brand: ${{ github.event.inputs.brand || 'fishers' }}
      soft_fail: true
    secrets: inherit

  # Only when the commit has no images yet. acc and prod never reach this —
  # resolve refuses a commit they cannot find a build for — and int and test
  # skip it whenever cd-int has already built the commit, which for anything
  # merged to main is the normal case.
  build-images:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.build == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      image_tag: latest
      brands: ${{ github.event.inputs.brand || 'fishers' }}
      registry_provider: ${{ github.event.inputs.REGISTRY_PROVIDER || 'NEBULACR' }}
    secrets: inherit

  deploy:
    # `always()` with an explicit result check: acc and prod skip the build on
    # purpose, and a skipped `needs` would otherwise mark this skipped too.
    # Edge may fail (continue-on-error) without blocking the ship.
    needs: [resolve, build-images, edge]
    if: >
      always() &&
      needs.resolve.result == 'success' &&
      (needs.edge.result == 'success' || needs.edge.result == 'failure') &&
      (needs.build-images.result == 'success' ||
       needs.build-images.result == 'skipped')
    uses: ./.github/workflows/deploy-fishers-k3s.yml
    with:
      target_env: ${{ github.event.inputs.ENV }}
      brand: ${{ github.event.inputs.brand || 'fishers' }}
      # The commit, never :latest — see the note at the top.
      image_tag: ${{ needs.resolve.outputs.sha }}
      registry_provider: ${{ github.event.inputs.REGISTRY_PROVIDER || 'NEBULACR' }}
      deploy_postgres: true
    secrets: inherit
