name: fishers
description: "Fishers for Android — feature parity with the iPhone app in ios/."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State: the closest thing to the iOS app's ObservableObject +
  # @EnvironmentObject, which is what ios/Fishers/ViewModels/ is built on.
  provider: ^6.1.2

  # The API client and the SSE stream both ride on this one package.
  http: ^1.2.2

  # Keychain on iOS, EncryptedSharedPreferences on Android — the Android half
  # of ios/Fishers/Services/KeychainStore.swift.
  flutter_secure_storage: ^9.2.2

  # UserDefaults, which is where AppConfig keeps the API base URL override.
  shared_preferences: ^2.3.2

  # Android push. The Android half of ios/Fishers/Services/PushRegistrar.swift,
  # which uses APNs — there is no shared layer between the two, only a shared
  # endpoint: both register a token with /notifications/register-device and let
  # the server pick the transport from the platform column.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
