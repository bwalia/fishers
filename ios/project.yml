name: Fishers

options:
  bundleIdPrefix: uk.co.fishers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.fishers.app
        PRODUCT_NAME: Fishers
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Simulator runs unsigned; set your team in Xcode to run on a device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
