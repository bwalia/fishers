name: Fishers
options:
  bundleIdPrefix: com.fishers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Balinder Walia — Apple Developer Team ID (Membership details / Xcode Accounts).
    # Keeps Automatic signing working after `xcodegen generate` without manual team pick.
    DEVELOPMENT_TEAM: "PAS2QUVJHC"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Google Sign-In SDK — Continue with Google on the auth screen.
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fishers/Fishers.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        # The API and web hosts this build talks to. The web host is where
        # shared live-scoreboard links point. Release must name production —
        # a TestFlight build is in someone else's hands and cannot reach a
        # machine on your network.
        FISHERS_API_BASE_URL: "http://127.0.0.1:7312"
        FISHERS_WEB_BASE_URL: "http://127.0.0.1:7311"
        # iOS OAuth client from Google Cloud Console (type "iOS"). Kept blank in
        # git; CI fills these from Vault / env via inject_google_oauth_client_ids!
        # before xcodegen so Info.plist gets the URL scheme.
        GOOGLE_IOS_CLIENT_ID: ""
        GOOGLE_REVERSED_CLIENT_ID: ""
      configs:
        Debug:
          # Loopback is right on the Simulator, which shares the Mac's network
          # stack. A real iPhone rejects it (that address is the phone itself)
          # and falls through to production — point it at a local API with
          # Profile -> API server, or FISHERS_API_URL in the scheme.
          # API is :7312; web/share links are :7311 — Next does not serve /api/v1.
          FISHERS_API_BASE_URL: "http://127.0.0.1:7312"
          FISHERS_WEB_BASE_URL: "http://127.0.0.1:7311"
        Release:
          # Production. Blank here meant TestFlight builds fell through to
          # AppConfig's fallback instead of reaching a server at all.
          FISHERS_API_BASE_URL: "https://www.fishers.cloud"
          FISHERS_WEB_BASE_URL: "https://www.fishers.cloud"
    info:
      path: Fishers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fishers
        # Debug/base expand to loopback; scripts/start.sh overrides at launch.
        # Release expands to production — see the Release config above.
        FishersAPIBaseURL: "$(FISHERS_API_BASE_URL)"
        FishersWebBaseURL: "$(FISHERS_WEB_BASE_URL)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Skip the export-compliance wait on every TestFlight upload. It has to
        # live here, not only in Info.plist: this target sets
        # GENERATE_INFOPLIST_FILE: false and xcodegen rewrites the file from
        # these properties, so a key added to the plist by hand is dropped the
        # next time anyone runs `xcodegen generate` — which scripts/start.sh
        # does on every launch.
        ITSAppUsesNonExemptEncryption: false
        # Required for App Store upload when TARGETED_DEVICE_FAMILY includes iPad
        # (ITMS 90474 — iPad multitasking needs all four orientations declared).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # NSAllowsLocalNetworking covers cleartext to any RFC1918 address, so a
        # LAN Mac needs no exception domain of its own — listing one meant every
        # change of address needed a project edit and a rebuild.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Scanning the other club's QR code at the toss is the only camera use.
        NSCameraUsageDescription: >-
          Fishers uses the camera to scan another club's QR code when you start
          a match, so you don't have to type their name.
        # Physical iPhones talking to the Mac's API over Wi-Fi need Local Network
        # permission. Without this string the prompt never appears, the connect
        # fails, and it looks as if the API is down. Must live here (xcodegen
        # rewrites Info.plist from these properties on every generate).
        NSLocalNetworkUsageDescription: >-
          Fishers reaches your club's scoring API on the same Wi-Fi — for
          example a Mac running the local server while you test on a phone.
        # Declaring a Bonjour service type is required for the Local Network
        # privacy prompt on some iOS versions even for plain HTTP to a LAN IP.
        NSBonjourServices:
          - "_http._tcp"
        UIBackgroundModes:
          - remote-notification
        # Google Sign-In: client id (also set at runtime from /auth/google) and
        # the reversed-client-id URL scheme the OAuth redirect lands on.
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"

  # Drives the real app in a Simulator: signs in, walks the screens, and saves
  # a screenshot of each as a test attachment. It is how the app gets *looked
  # at* rather than only compiled — a layout that breaks still builds.
  #
  # Needs an API on the host: `./scripts/start.sh --no-ios` first. Skips itself
  # with a clear message when there isn't one, rather than failing as if the app
  # were broken.
  FishersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FishersUITests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  FishersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FishersTests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
        FishersTests: [test]
        FishersUITests: [test]
    test:
      targets:
        - FishersTests

  # Separate scheme: the UI tests need a running API, so they must not be part
  # of the plain `test` run that CI does on every push.
  FishersUI:
    build:
      targets:
        Fishers: all
        FishersUITests: [test]
    test:
      targets:
        - FishersUITests
