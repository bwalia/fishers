name: Fishers
options:
  bundleIdPrefix: com.fishers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Balinder Walia — Apple Developer Team ID (Membership details / Xcode Accounts).
    # Keeps Automatic signing working after `xcodegen generate` without manual team pick.
    DEVELOPMENT_TEAM: "PAS2QUVJHC"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        # The API and web hosts this build talks to. Release is blank — set both
        # before shipping. The web host is where shared live-scoreboard links point.
        FISHERS_API_BASE_URL: "http://127.0.0.1:7312"
        FISHERS_WEB_BASE_URL: "http://127.0.0.1:7311"
      configs:
        Debug:
          # Info.plist still expands to loopback for Simulator builds. A real
          # iPhone ignores an empty/loopback resolution failure path in
          # AppConfig and falls back to http://192.168.1.177:8080 (same Wi-Fi
          # as the Mac). Override with FISHERS_API_URL / UserDefaults when the
          # lease moves. Web share links stay on :7311.
          FISHERS_API_BASE_URL: "http://127.0.0.1:7312"
          FISHERS_WEB_BASE_URL: "http://127.0.0.1:7311"
        Release:
          FISHERS_API_BASE_URL: ""
          FISHERS_WEB_BASE_URL: ""
    info:
      path: Fishers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fishers
        # Debug/base expand to loopback; scripts/start.sh overrides at launch.
        # Release must set production hosts before shipping (empty values fail
        # closed in AppConfig).
        FishersAPIBaseURL: "$(FISHERS_API_BASE_URL)"
        FishersWebBaseURL: "$(FISHERS_WEB_BASE_URL)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Skip the export-compliance wait on every TestFlight upload. It has to
        # live here, not only in Info.plist: this target sets
        # GENERATE_INFOPLIST_FILE: false and xcodegen rewrites the file from
        # these properties, so a key added to the plist by hand is dropped the
        # next time anyone runs `xcodegen generate` — which scripts/start.sh
        # does on every launch.
        ITSAppUsesNonExemptEncryption: false
        # Required for App Store upload when TARGETED_DEVICE_FAMILY includes iPad
        # (ITMS 90474 — iPad multitasking needs all four orientations declared).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # NSAllowsLocalNetworking covers cleartext to any RFC1918 address, so a
        # LAN Mac needs no exception domain of its own — listing one meant every
        # change of address needed a project edit and a rebuild.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Scanning the other club's QR code at the toss is the only camera use.
        NSCameraUsageDescription: >-
          Fishers uses the camera to scan another club's QR code when you start
          a match, so you don't have to type their name.
        # Physical iPhones talking to the Mac's API over Wi-Fi need Local Network
        # permission. Without this string the prompt never appears, the connect
        # fails, and it looks as if the API is down. Must live here (xcodegen
        # rewrites Info.plist from these properties on every generate).
        NSLocalNetworkUsageDescription: >-
          Fishers reaches your club's scoring API on the same Wi-Fi — for
          example a Mac running the local server while you test on a phone.
        # Declaring a Bonjour service type is required for the Local Network
        # privacy prompt on some iOS versions even for plain HTTP to a LAN IP.
        NSBonjourServices:
          - "_http._tcp"
        UIBackgroundModes:
          - remote-notification

  # Drives the real app in a Simulator: signs in, walks the screens, and saves
  # a screenshot of each as a test attachment. It is how the app gets *looked
  # at* rather than only compiled — a layout that breaks still builds.
  #
  # Needs an API on the host: `./scripts/start.sh --no-ios` first. Skips itself
  # with a clear message when there isn't one, rather than failing as if the app
  # were broken.
  FishersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FishersUITests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  FishersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FishersTests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
        FishersTests: [test]
        FishersUITests: [test]
    test:
      targets:
        - FishersTests

  # Separate scheme: the UI tests need a running API, so they must not be part
  # of the plain `test` run that CI does on every push.
  FishersUI:
    build:
      targets:
        Fishers: all
        FishersUITests: [test]
    test:
      targets:
        - FishersUITests
