name: Fishers
options:
  bundleIdPrefix: com.fishers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        # The API and web hosts this build talks to. Base/Debug use the LAN Mac
        # so physical iPhones can reach the API. Release is blank — set both
        # before shipping. The web host is where shared live-scoreboard links point.
        FISHERS_API_BASE_URL: "http://192.168.1.99:8080"
        FISHERS_WEB_BASE_URL: "http://192.168.1.99:3000"
      configs:
        Debug:
          # LAN host for physical iPhone testing (Simulator can use the same
          # addresses when the API/web bind 0.0.0.0). API is :8080; web/share
          # links are :3000 — Next does not serve /api/v1.
          FISHERS_API_BASE_URL: "http://192.168.1.99:8080"
          FISHERS_WEB_BASE_URL: "http://192.168.1.99:3000"
        Release:
          FISHERS_API_BASE_URL: ""
          FISHERS_WEB_BASE_URL: ""
    info:
      path: Fishers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fishers
        # Debug/base expand to the LAN Mac. Release must set production hosts
        # before shipping (empty values fail closed in AppConfig).
        FishersAPIBaseURL: "$(FISHERS_API_BASE_URL)"
        FishersWebBaseURL: "$(FISHERS_WEB_BASE_URL)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Required for App Store upload when TARGETED_DEVICE_FAMILY includes iPad
        # (ITMS 90474 — iPad multitasking needs all four orientations declared).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            192.168.1.99:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Scanning the other club's QR code at the toss is the only camera use.
        NSCameraUsageDescription: >-
          Fishers uses the camera to scan another club's QR code when you start
          a match, so you don't have to type their name.
        UIBackgroundModes:
          - remote-notification

  FishersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FishersTests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
        FishersTests: [test]
    test:
      targets:
        - FishersTests
