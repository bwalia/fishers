name: Fishers
options:
  bundleIdPrefix: com.fishers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        # The API and web hosts this build talks to. Release is deliberately
        # blank: set both before shipping, and AppConfig complains loudly if you
        # forget. The web host is where shared live-scoreboard links point.
        FISHERS_API_BASE_URL: ""
        FISHERS_WEB_BASE_URL: ""
      configs:
        Debug:
          FISHERS_API_BASE_URL: "http://127.0.0.1:8080"
          FISHERS_WEB_BASE_URL: "http://127.0.0.1:3000"
    info:
      path: Fishers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fishers
        # Per-configuration API host. Debug points at the Mac running the API;
        # set FISHERS_API_BASE_URL in the Release configuration before shipping.
        FishersAPIBaseURL: "$(FISHERS_API_BASE_URL)"
        FishersWebBaseURL: "$(FISHERS_WEB_BASE_URL)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Scanning the other club's QR code at the toss is the only camera use.
        NSCameraUsageDescription: >-
          Fishers uses the camera to scan another club's QR code when you start
          a match, so you don't have to type their name.
        UIBackgroundModes:
          - remote-notification

  FishersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FishersTests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
        FishersTests: [test]
    test:
      targets:
        - FishersTests
