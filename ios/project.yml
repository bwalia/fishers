name: Fishers
options:
  bundleIdPrefix: com.fishers
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fishers:
    type: application
    platform: iOS
    sources:
      - path: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app
        INFOPLIST_FILE: Fishers/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    info:
      path: Fishers/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fishers
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification

  FishersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FishersTests
    dependencies:
      - target: Fishers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fishers.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fishers:
    build:
      targets:
        Fishers: all
        FishersTests: [test]
    test:
      targets:
        - FishersTests
