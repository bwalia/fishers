{{- if not .Values.secret.jwtSecret }}
{{- fail "secret.jwtSecret is empty. Pass --set secret.jwtSecret=... from a CI secret. A shared default would make every environment's tokens forgeable in every other one." }}
{{- end }}
{{- if not .Values.database.password }}
{{- fail "database.password is empty. Pass --set database.password=... from a CI secret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fishers-api.name" . }}
  labels:
    {{- include "fishers-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Assembled here rather than passed in whole: the parts are already values,
  # and one place composing the DSN means the API and any job that needs it
  # cannot drift apart on the host or the database name.
  DATABASE_URL: {{ include "fishers-api.databaseUrl" . | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  {{- with .Values.config.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
