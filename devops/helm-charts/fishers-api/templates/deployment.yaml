apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fishers-api.name" . }}
  labels:
    {{- include "fishers-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fishers-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fishers-api.labels" . | nindent 8 }}
      annotations:
        # A new value every deploy, so every deploy rolls the pods. The
        # secrets now come from the vault through ESO rather than from this
        # chart, so there is no rendered Secret to checksum — and the promote
        # path deploys :latest, where an unchanged tag would otherwise roll
        # nothing. The deploy force-syncs the vault first, so the new pods
        # start on the values that were just changed.
        fishers.cloud/rollout: {{ .Values.rolloutId | default "manual" | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            # The database credentials belong to the Zalando operator, which
            # generates them into its own Secret; they are read straight from
            # there and never pass through the vault, CI or helm. Defined
            # before DATABASE_URL so the $(...) references below resolve — the
            # password is 64 alphanumeric characters, so it is URL-safe as is.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fishers-api.dbSecret" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fishers-api.dbSecret" . }}
                  key: password
            # sslmode=require: Spilo rejects every non-TLS connection from
            # another pod. It encrypts without verifying the certificate, which
            # is what Spilo's self-signed one allows.
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ .Values.db.clusterName }}:5432/{{ .Values.db.name }}?sslmode={{ .Values.db.sslmode }}"
            - name: API_HOST
              value: "[::]"
            - name: API_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: JWT_ACCESS_TTL_SECS
              value: {{ .Values.config.jwtAccessTtlSecs | quote }}
            - name: JWT_REFRESH_TTL_SECS
              value: {{ .Values.config.jwtRefreshTtlSecs | quote }}
            - name: DLS_G50
              value: {{ .Values.config.dlsG50 | quote }}
            - name: FISHERS_AGENT_MODEL
              value: {{ .Values.config.agentModel | quote }}
            # Same host serves the dashboard and the API, so share links point
            # at the host the person is already on and CORS never enters into
            # it. Set explicitly all the same: the API mints these links into
            # chat, where they outlive the request that made them.
            - name: PUBLIC_WEB_BASE
              value: "https://{{ include "fishers-api.hostname" . }}"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://{{ include "fishers-api.hostname" . }}"
            {{- with .Values.config.ollamaUrl }}
            - name: OLLAMA_URL
              value: {{ . | quote }}
            - name: OLLAMA_MODEL
              value: {{ $.Values.config.ollamaModel | quote }}
            {{- end }}
            {{- with .Values.config.dlsResourceTable }}
            - name: DLS_RESOURCE_TABLE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.s3.enabled }}
            # Uploads. The endpoint is the in-cluster service; the public base
            # is where a browser fetches the object from — the same host, under
            # the bucket's path, which the web chart's ingress sends to MinIO.
            # The access keys arrive from the vault with everything else.
            - name: S3_ENDPOINT
              value: {{ .Values.config.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.config.s3.region | quote }}
            - name: S3_PUBLIC_BASE
              value: {{ .Values.config.s3.publicBase | default (printf "https://%s/%s" (include "fishers-api.hostname" .) .Values.config.s3.bucket) | quote }}
            {{- end }}
          # Everything at kv/fishers/<ring>/config: JWT_SECRET, S3 keys, VAPID,
          # and whichever optional integrations that ring has (Stripe,
          # Anthropic). A key added in the vault needs no chart change.
          envFrom:
            - secretRef:
                name: {{ .Values.secretsName }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the process still wants a
            # scratch area.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
