# Defaults shared by every environment. Anything that differs per ring lives in
# values-<env>.yaml, and the deploy workflow passes -f values.yaml -f values-<env>.yaml.
env: int
# The public host for this ring. Always set from values-<env>.yaml; empty is
# refused, because it would render "https://" into PUBLIC_WEB_BASE and mint
# share links that go nowhere.
hostname: ""
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest
  pullPolicy: Always
imagePullSecrets:
  - name: fishers-registry

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# The ingress lives in the fishers-web chart, which owns `/` for the host and
# routes /api and /swagger-ui here. One ingress per host means one certificate
# and one wslproxy vhost, and it cannot disagree with itself about which
# service serves which path.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Liveness is /health — a constant string, so it answers while the process is
# alive whatever the database is doing. That is exactly what liveness should
# test: restarting the pod cannot fix a database outage, and a liveness probe
# wired to the database turns one failed dependency into a crash-loop.
livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness is /health/ready, which touches the pool. A pod that cannot reach
# Postgres should leave the Service — it has nothing to serve — but it should
# not be killed.
readinessProbe:
  enabled: true
  path: /health/ready
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Migrations replay on boot and take a moment on a fresh database; startup has
# its own budget so a slow first start is not mistaken for a hang.
startupProbe:
  enabled: true
  path: /health
  periodSeconds: 5
  failureThreshold: 30

# The fishers-db release (Zalando) in the same namespace. These must match that
# chart's clusterName, database and owner — the credentials Secret name is
# derived from them.
db:
  clusterName: fishers-db
  name: fishers
  owner: fishers
  sslmode: require

# The Secret the fishers-secrets release syncs from the vault.
secretsName: fishers-secrets

# Set by the deploy to its run id, so every deploy rolls the pods.
rolloutId: ""

config:
  # Object storage for uploads, served by the fishers-minio chart in the same
  # namespace. The access keys go in the secret, not here.
  s3:
    enabled: true
    endpoint: "http://fishers-minio:9000"
    # Also the public path: https://<host>/media/<key>. Must match the
    # fishers-minio bucket and the web chart's media.path.
    bucket: media
    region: us-east-1
    # Empty: derived as https://<hostname>/<bucket>.
    publicBase: ""

  jwtAccessTtlSecs: 900
  jwtRefreshTtlSecs: 2592000
  rustLog: "fishers_api=info,fishers_notifications=info,fishers_jobs=info,tower_http=warn,sqlx=warn"
  dlsG50: 245
  # Optional integrations. Empty means unset — the API treats an empty
  # DLS_RESOURCE_TABLE as "use the built-in table". Credentials for the rest
  # (ANTHROPIC_API_KEY, STRIPE_*) live in the vault, not here.
  agentModel: "claude-opus-5"
  dlsResourceTable: ""
  ollamaUrl: ""
  ollamaModel: "llama3.1:8b"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
