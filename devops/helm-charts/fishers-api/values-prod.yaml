# prod ring — see values.yaml for everything not repeated here.
env: prod
hostname: www.fishers.cloud
replicaCount: 2

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest

resources:
  requests:
    cpu: 300m
    memory: 256Mi
  limits:
    memory: 1Gi

config:
  rustLog: "fishers_api=info,tower_http=warn,sqlx=error"
