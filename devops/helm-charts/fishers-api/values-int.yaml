# int ring — see values.yaml for everything not repeated here.
env: int
hostname: int.fishers.cloud
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  rustLog: "fishers_api=debug,fishers_notifications=info,fishers_jobs=info,tower_http=info,sqlx=warn"
  # Ball-by-ball commentary. Without this the API builds no model client at
  # all and the scoring screen says so — which is what every ring has been
  # doing since the feature landed, because no ring ever set it.
  #
  # The cluster's own Service for the model host, by name rather than by
  # address: in-cluster DNS is what the rest of this chart talks to, and a
  # LAN address in a values file is a route nobody can audit.
  #
  # It does live in another namespace, so if `acc` is ever torn down this
  # wants a Service of its own in the fishers namespaces pointing at the same
  # endpoint. Commentary going quiet is the symptom, and the screen says so
  # plainly rather than failing silently.
  ollamaUrl: "http://ollama-external.acc.svc.cluster.local:11434"
  # Longer than the built-in 15: this host has no GPU reserved for us and a
  # model that has to load first will not answer inside it. A line that misses
  # its ball is wasted either way, so the ceiling is about not holding a
  # connection through the rest of the over.
  ollamaTimeoutSecs: "25"
