# int ring — see values.yaml for everything not repeated here.
env: int
hostname: int.fishers.cloud
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  rustLog: "fishers_api=debug,fishers_notifications=info,fishers_jobs=info,tower_http=info,sqlx=warn"
  # Ball-by-ball commentary. Without this the API builds no model client at
  # all and the scoring screen says so — which is what every ring had been
  # doing since the feature landed, because no ring ever set it.
  #
  # The published gateway, which is where everything in this cluster that
  # actually talks to a model points: beacon-api and the registry scanner both
  # use it. The in-cluster Service `acc/ollama-external` looks like the
  # obvious answer and is not — nothing reaches the host behind it, and the
  # API logged "ollama unreachable" against it.
  ollamaUrl: "https://ollama.workstation.co.uk"
  # A model that gateway actually serves. The chart's default `llama3.1:8b` is
  # not one of them: what runs there is qwen3, and beacon asks for this exact
  # name.
  ollamaModel: "qwen3:30b-a3b"
  # Sixty, as beacon uses. A 30B model is not quick, and the built-in 15 would
  # cut off a line that was coming. It costs the scorer nothing to wait: the
  # browser drops its own request the moment the next ball is recorded, so
  # this is only a ceiling on how long the server holds a connection.
  ollamaTimeoutSecs: "60"
  # The gateway answers 403 without a key, which reaches the app as a model
  # with nothing to say. The key is not here: put it in the ring's vault as
  # OLLAMA_API_KEY at kv/<brand>/int/config and `envFrom` carries it in, the
  # same way SMTP and Stripe credentials arrive.
