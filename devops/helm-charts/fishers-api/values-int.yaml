# int ring — see values.yaml for everything not repeated here.
env: int
hostname: int.fishers.cloud
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  rustLog: "fishers_api=debug,fishers_notifications=info,fishers_jobs=info,tower_http=info,sqlx=warn"
  # Ball-by-ball commentary. Without this the API builds no model client at
  # all and the scoring screen says so — which is what every ring had been
  # doing since the feature landed, because no ring ever set it.
  #
  # The published gateway, which is where everything in this cluster that
  # actually talks to a model points: beacon-api and the registry scanner both
  # use it. The in-cluster Service `acc/ollama-external` looks like the
  # obvious answer and is not — nothing reaches the host behind it, and the
  # API logged "ollama unreachable" against it.
  ollamaUrl: "https://ollama.workstation.co.uk"
  # The model the project's own .env has always asked for: small and quick,
  # which is what ball-by-ball needs. The gateway serves fifteen, qwen3:30b
  # and the chart's llama3.1:8b among them — a bigger one writes a better
  # line and misses the ball it was about.
  ollamaModel: "qwen3.8-fast:latest"
  # Forty-five, as the local .env uses. The built-in 15 can cut off a line
  # that was coming; past this it is not worth holding the connection, and
  # the browser has abandoned its own request long before — it drops it the
  # moment the next ball is recorded.
  ollamaTimeoutSecs: "45"
  # The gateway answers 403 to an unsigned request, which reaches the app as
  # a model with nothing to say. OLLAMA_API_KEY is not a bearer token and is
  # never sent as one: the API signs a 120-second HS256 JWT with it per
  # request and sends that as x-api-key. The passphrase lives in the ring's
  # vault at kv/<brand>/int/config, where envFrom picks it up like the SMTP
  # and Stripe credentials.
