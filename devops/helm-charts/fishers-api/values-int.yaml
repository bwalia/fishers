# int ring — see values.yaml for everything not repeated here.
env: int
hostname: int.fishers.cloud
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-api
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  rustLog: "fishers_api=debug,fishers_notifications=info,fishers_jobs=info,tower_http=info,sqlx=warn"
  # Ball-by-ball commentary. Without this the API builds no model client at
  # all and the scoring screen says so — which is what every ring had been
  # doing since the feature landed, because no ring ever set it.
  #
  # The model host over the LAN, through the Service the cluster already has
  # for it. The published gateway at ollama.workstation.co.uk resolves to a
  # public address, so a pod on this LAN would have to leave the network and
  # come back in through the router to reach a machine three hops away — and
  # that hairpin is exactly the sort of thing a home router declines.
  #
  # The host is open to the LAN: ollama listens on *:11434 and its firewall is
  # off, so this needs no gateway and no key.
  ollamaUrl: "http://ollama-external.acc.svc.cluster.local:11434"
  # The model the gateway keeps *resident*, which turns out to be the only
  # thing that matters here. /api/ps lists what is loaded, and
  # qwen3.8-fast:latest is not among them — asking for it makes the host pull
  # 17.7GB off disk on every ball, which is why the API logged nothing but
  # timeouts. Same family, same size, and it answers in about 20 seconds.
  #
  # Measured on the models that *are* resident: this one 19.8s and 21.8s,
  # llama3.1:8b 56s and 73s despite being a third of the size. Residency
  # beats parameter count on this hardware, so check /api/ps before changing
  # this line.
  ollamaModel: "qwen3.8:latest"
  # 45, not 25, and the reason the old number existed is gone: main.rs used to
  # wrap EVERY route in a 30-second TimeoutLayer, so anything above ~28 here
  # could never be reached. Commentary now has a router of its own with 60
  # seconds, because it waits on a model rather than on the database.
  #
  # 25 was fine for English and was never enough for Punjabi, which is the
  # whole of why commentary worked when it was tested and not when it was
  # used. Measured from inside gullycricket-int against this model, same ball,
  # same prompts as the code sends:
  #
  #   English only  (num_predict 80)    7.9s
  #   English + Punjabi (JSON, 220)     21.6s, and 35.2s with the host busy
  #
  # Gurmukhi costs several tokens per word, so the bilingual answer is most of
  # a minute's worth of generation on a bad day. At 25 it tipped over the edge
  # and reqwest reported its own timeout in the same words it uses for a
  # refused connection, so the log said "unreachable" about a model that was
  # answering fine. 45 clears the measured worst case and still sits inside
  # the route's 60.
  ollamaTimeoutSecs: "45"
  # The gateway answers 403 to an unsigned request, which reaches the app as
  # a model with nothing to say. OLLAMA_API_KEY is not a bearer token and is
  # never sent as one: the API signs a 120-second HS256 JWT with it per
  # request and sends that as x-api-key. The passphrase lives in the ring's
  # vault at kv/<brand>/int/config, where envFrom picks it up like the SMTP
  # and Stripe credentials.
