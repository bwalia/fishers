apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fishers-minio.name" . }}
  labels:
    {{- include "fishers-minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MinIO's own names for the root credentials.
  MINIO_ROOT_USER: {{ required "auth.accessKey is required — pass it with --set from a CI secret" .Values.auth.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ required "auth.secretKey is required — pass it with --set from a CI secret" .Values.auth.secretKey | quote }}
