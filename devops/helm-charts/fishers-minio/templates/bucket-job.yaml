{{- /*
  Makes the bucket and opens it for reading, once per install or upgrade.

  Avatars are fetched straight by the browser, so the objects have to be
  publicly readable; writing still needs the signed credentials. A hook rather
  than an init container, because it is a property of the environment rather
  than of the pod, and it must not re-run on every restart.

  Readable is not the same as listable. `mc anonymous set download` also hands
  out s3:ListBucket, so anyone could ask the bucket for every key it holds and
  read back the avatar of every member of every club. The policy below allows
  exactly one thing — fetching an object whose key you already have.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fishers-minio.name" . }}-bucket
  labels:
    {{- include "fishers-minio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "fishers-minio.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            # The root credentials ARE the API's S3 keys, read from the same
            # vault-synced Secret — so the two cannot drift, and there is no
            # second copy for a deploy to pass on the command line.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: S3_SECRET_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set target \
                http://{{ include "fishers-minio.name" . }}:{{ .Values.service.port }} \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio"; sleep 3
              done
              mc mb --ignore-existing target/{{ .Values.bucket }}
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::{{ .Values.bucket }}/*"]}]}' > /tmp/public-read.json
              mc anonymous set-json /tmp/public-read.json target/{{ .Values.bucket }}
              echo "bucket {{ .Values.bucket }} ready: objects readable, keys not listable"
