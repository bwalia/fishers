apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fishers-minio.name" . }}
  labels:
    {{- include "fishers-minio.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fishers-minio.name" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fishers-minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fishers-minio.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.service.consolePort }}"
          ports:
            - name: s3
              containerPort: {{ .Values.service.port }}
            - name: console
              containerPort: {{ .Values.service.consolePort }}
          envFrom:
            - secretRef:
                name: {{ include "fishers-minio.name" . }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
