apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fishers-minio.name" . }}
  labels:
    {{- include "fishers-minio.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "fishers-minio.name" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "fishers-minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fishers-minio.labels" . | nindent 8 }}
      annotations:
        # Restart only when MinIO's own keys change, not on every deploy: it is
        # a single replica, so a roll is a few seconds without photos. `lookup`
        # reads the live Secret, which the deploy has just force-synced from
        # the vault. (Renders empty under `helm template`, which has no
        # cluster — harmless there.)
        {{- $live := lookup "v1" "Secret" .Release.Namespace .Values.secretsName }}
        fishers.cloud/credentials: {{ printf "%v%v" (dig "data" "S3_ACCESS_KEY" "" $live) (dig "data" "S3_SECRET_KEY" "" $live) | sha256sum | trunc 16 | quote }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.service.consolePort }}"
          ports:
            - name: s3
              containerPort: {{ .Values.service.port }}
            - name: console
              containerPort: {{ .Values.service.consolePort }}
          env:
            # The root credentials ARE the API's S3 keys, read from the same
            # vault-synced Secret — so the two cannot drift, and there is no
            # second copy for a deploy to pass on the command line.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: S3_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
