# One MinIO per environment, in that environment's namespace.
#
# The same shape as the Postgres chart and for the same reason: a StatefulSet
# with a single replica and its own PVC, so the volume is reattached to the
# same pod identity across a restart. Uploads are not something to lose during
# a rollout.
#
# MinIO speaks S3, so the API's storage client is the same code here as it
# would be against real S3 — swap the endpoint and the keys.
env: int

image:
  # Our own copy in spectoncr, not quay.io or Docker Hub. Both upstreams now
  # answer 401 on the manifest, and `dl.min.io` is 410 Gone. A ring only kept
  # running because some node still had the layer cached, and a pod that moved
  # to any other node never started again.
  #
  # Mirrored 2026-11-13 from a node's containerd cache (same digest as
  # upstream, sha256:a1ea29fa…), into the same registry and pull secret the
  # API and web images use. To mirror a new tag, push it from any node
  # that has it:
  #   k3s ctr -n k8s.io images push --plain-http --platform linux/amd64 \
  #     -u "$USER:$PASS" 127.0.0.1:30500/fishers/minio:<tag> quay.io/minio/minio:<tag>
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/minio
  tag: "RELEASE.2025-04-22T22-12-26Z"
  pullPolicy: IfNotPresent

# The bucket job's client. Mirrored the same way as the server image.
mcImage: "int-spectoncr.diytaxreturn.co.uk/fishers/minio-mc:RELEASE.2025-04-16T18-13-26Z"

# Created by the deploy workflow in every ring ("Ensure namespace and registry
# pull secret"), the same secret the API and web charts use.
imagePullSecrets:
  - name: fishers-registry

# The vault-synced Secret (fishers-secrets release). MinIO's root credentials
# are its S3_ACCESS_KEY / S3_SECRET_KEY.
secretsName: fishers-secrets

# Also the public path, https://<host>/media/<key>: the web chart's ingress
# sends /media here. Must match the API's config.s3.bucket.
bucket: media

service:
  port: 9000
  consolePort: 9001

# Where a browser fetches an uploaded picture from. Empty means the in-cluster
# service, which only works if something else proxies it — set this per ring to
# the public host.
publicBase: ""

persistence:
  enabled: true
  size: 20Gi
  # Named, not left to the default — this cluster marks both local-path and
  # longhorn as default. Longhorn replicates across nodes; local-path does not.
  storageClass: longhorn

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# Where MinIO may run: anywhere. It used to be pinned to nodes labelled
# fishers.cloud/minio-image=cached, the only ones that could start it while
# the image came from quay.io (fishers-int sat in ImagePullBackOff for days
# after a move to debworker00). Now that the image is mirrored (see `image`),
# any node can pull it, so the pin is gone. The node labels are harmless and
# can be removed.
nodeSelector: {}

tolerations: []
