{{- if not .Values.auth.password }}
{{- fail "auth.password is empty. Pass --set auth.password=... from a CI secret — the same value the API chart gets, or the API cannot log in." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fishers-postgres.name" . }}
  labels:
    {{- include "fishers-postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
