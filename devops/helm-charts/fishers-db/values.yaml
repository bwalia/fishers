env: int

# The operator names everything after this: the master Service is
# `<clusterName>` and the credentials Secret is
# `<user>.<clusterName>.credentials.postgresql.acid.zalan.do`. The API chart
# derives both from the same value, so change it in one place or not at all.
clusterName: fishers-db
teamId: fishers

database: fishers
# The database owner. The API runs its own migrations, so it owns the schema;
# both extensions it creates (pgcrypto, pg_trgm) are trusted and need no
# superuser.
owner: fishers

postgresVersion: "16"

# One instance per ring by default; prod raises it for a streaming standby that
# Patroni promotes automatically if the master's node goes.
instances: 1

volume:
  size: 8Gi
  # Named, not left to the default: this cluster marks BOTH local-path and
  # longhorn as default, which leaves the choice to chance. local-path is
  # node-local — lose the node, lose the data. Longhorn replicates the volume
  # across nodes.
  storageClass: longhorn

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# A nightly dump into MinIO.
#
# Patroni and (on prod) a standby cover a node dying. Neither covers a bad
# migration, a DROP, or the cluster being deleted — for that there has to be a
# file somewhere else, and this is it.
backup:
  enabled: true
  # 02:15, after midnight jobs and before anybody is at a ground — and said in
  # UTC, or the controller reads it in the node's British local time and half
  # the year it fires an hour earlier than the object names claim.
  schedule: "15 2 * * *"
  timeZone: "Etc/UTC"
  # How long a night's dump is kept. Read by `mc rm --older-than`.
  keepFor: "14d"
  # Its own bucket, never the media one: media is readable by anyone holding a
  # key so avatars load in a browser, and a dump is everyone's data in one file.
  bucket: db-backups
  minioService: fishers-minio
  minioPort: 9000
  # The same vault-synced Secret the API and MinIO itself use.
  secretsName: fishers-secrets
  # Our mirror, not quay.io or Docker Hub: both now 401 on the manifest. A
  # backup that can't pull its uploader at 02:15 silently doesn't happen. That
  # was gullycricket-prod on 2026-11-11 and 11-13: the job landed on a node
  # without the image cached and sat in ImagePullBackOff for the whole 3 h
  # deadline. See fishers-minio/values.yaml for how the mirror is fed.
  mcImage: "int-spectoncr.diytaxreturn.co.uk/fishers/minio-mc:RELEASE.2025-04-16T18-13-26Z"
  # Created in every ring by the deploy workflow; needed for mcImage above.
  imagePullSecrets:
    - name: fishers-registry
  # pg_dump's -Fc compression level, 0-9.
  compression: 6
  # Room for the dump on the node's disk. Over this, the pod is evicted.
  workspaceSize: 2Gi
  # Missed the slot (the controller was down)? Still run, within the hour.
  startingDeadlineSeconds: 3600
  # A whole run takes ~10 s at ~1 MB of dump. Past 30 minutes something is
  # wedged, usually a pull stuck in ImagePullBackOff, which never fails a Job
  # by itself. The deadline is what turns that into a failed Job, and so into
  # the KubeJobFailed alert. Three hours meant nobody heard until breakfast.
  activeDeadlineSeconds: 1800
  # One retry. A dump that fails twice needs a person, not a third attempt.
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  # Kept deliberately: a CronJob only shows its last run failed while the Job
  # object still exists.
  failedJobsHistoryLimit: 3
  # The copy outside the cluster. Where it goes and the key it is encrypted
  # with are ring secrets (OFFSITE_S3_ENDPOINT, OFFSITE_S3_BUCKET,
  # OFFSITE_S3_ACCESS_KEY, OFFSITE_S3_SECRET_KEY, BACKUP_ENCRYPTION_KEY at
  # kv/fishers/<ring>/config); these are only the knobs.
  offsite:
    # Longer than the in-cluster 14 days: this is the copy for the bad week
    # nobody noticed until later.
    keepFor: "30d"
    # PBKDF2 rounds for the passphrase. Changing it makes older copies need the
    # old number to decrypt — the restore runbook says which to use.
    kdfIterations: 600000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
