{{- /*
  The operator turns this into a Patroni-managed Spilo cluster, and generates
  the owner's password itself into
  <owner>.<clusterName>.credentials.postgresql.acid.zalan.do.

  There is no database password anywhere in this chart, in the vault, or in
  CI: nothing to leak into a helm release, nothing to rotate by hand, and no
  way for two copies of it to disagree.
*/ -}}
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: {{ .Values.clusterName }}
  labels:
    app.kubernetes.io/name: fishers-db
    app.kubernetes.io/part-of: fishers
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  teamId: {{ .Values.teamId | quote }}
  numberOfInstances: {{ .Values.instances }}
  postgresql:
    version: {{ .Values.postgresVersion | quote }}
    {{- with .Values.parameters }}
    parameters:
      {{- range $k, $v := . }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
    {{- end }}
  volume:
    size: {{ .Values.volume.size }}
    {{- if .Values.localVolumes.enabled }}
    storageClass: {{ .Release.Namespace }}-pgdata-local
    {{- else }}
    storageClass: {{ .Values.volume.storageClass }}
    {{- end }}
  {{- with .Values.nodeSelector }}
  # Pinned (brands/<brand>.yaml `placement`): every member on this node.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            {{- range $k, $v := . }}
            - key: {{ $k }}
              operator: In
              values: [{{ $v | quote }}]
            {{- end }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  users:
    {{ .Values.owner }}: []
  databases:
    {{ .Values.database }}: {{ .Values.owner }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
