{{- /*
  Everything at kv/<vaultPrefix>/<env>/config becomes one Secret.

  dataFrom.extract rather than a list of named keys, on purpose: a key added in
  the vault reaches the app on the next deploy with no chart change, and an
  optional key that is not set (Stripe on a ring that takes no payments) is
  simply absent instead of failing the whole sync. The deploy checks for the
  keys that are genuinely required, and names the vault path when one is
  missing.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    app.kubernetes.io/name: fishers-secrets
    app.kubernetes.io/part-of: fishers
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.store.kind }}
    name: {{ .Values.store.name }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    # Retain: uninstalling this release must not pull the credentials out from
    # under a database and an API that are still running.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ printf "%s/%s/config" .Values.vaultPrefix .Values.env }}
