# The ring this is installed into. The vault path is derived from it, so a ring
# can only ever read its own secrets.
env: int

# The platform's store: a ClusterSecretStore pointing at WSLVault's
# Vault-compatible KV v2 API. Other products on this cluster already sync
# through it.
store:
  kind: ClusterSecretStore
  name: wslvault-backend

# kv/<vaultPrefix>/<env>/config
#
# The brand, set by the deploy. It defaults to fishers so an install by hand
# still works, but every brand must have its own: sharing a path means sharing
# a JWT_SECRET, and a token minted by one brand would then authenticate on
# another. Separate databases are not separation if the keys are shared.
vaultPrefix: fishers

# How often ESO re-reads the vault. The deploy also forces a sync before it
# rolls any pod, so a deploy never starts on a stale copy.
refreshInterval: 1m

# The Secret the charts read. Every key at the vault path lands here as-is.
secretName: fishers-secrets
