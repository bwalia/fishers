# Defaults shared by every environment; per-ring differences live in
# values-<env>.yaml.
env: int
# Which brand this release is. Supplied by the deploy from brands/<id>.yaml;
# the image is already built for it, so this is here to label what is running
# rather than to change it — a runtime brand switch is how a whole region gets
# served the wrong logo after one bad value.
brand: fishers
# The public host for this ring. Empty is refused — it is the ingress rule.
hostname: ""
replicaCount: 1

image:
  repository: int-spectoncr.diytaxreturn.co.uk/fishers/fishers-web
  tag: latest
  pullPolicy: Always
imagePullSecrets:
  - name: fishers-registry

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# This chart owns the ingress for the whole host.
#
# One host per environment, split by path: `/` is the dashboard, `/api` and
# `/swagger-ui` are the API. That means one certificate, one Cloudflare CNAME
# and one wslproxy vhost per ring instead of two of each — and, because the
# browser never leaves the origin it loaded, no CORS configuration to keep in
# step with four environments.
#
# It lives in the web chart rather than the api chart because the web chart is
# deployed last: by the time the ingress exists, both Services it names are
# already there. An ingress created ahead of its backend answers 503 until the
# backend catches up, which reads as a broken deploy.
# Where a server-side render reaches the API: the in-cluster Service, not the
# public host. The browser never uses this — it calls /api on its own origin.
#
# This stays on fishers-api even where Kong is in front, and deliberately: a
# render on the server is already inside the trust boundary, and sending it
# through the gateway would buy nothing but a second hop and a second thing to
# be down.
apiInternalBase: http://fishers-api:8080

# Kong in front of the API, ring by ring.
#
# Off: Traefik sends /api, /swagger-ui and /health straight to fishers-api:8080.
# On:  Traefik sends them to Kong, and Kong proxies to fishers-api — so rate
#      limits, keys and the rest of the gateway's plugins apply to every call
#      from a browser, while server-side renders keep going direct.
#
# Traefik stays the IngressClass either way. This does not install the Kong
# Ingress Controller, and Kong never owns an Ingress here: it is one more
# backend Service that this chart's ingress happens to point at.
#
# Deploy Kong for the ring *before* turning this on — workflow-examples/
# fishers-kongapi, `KUBECONFIG=~/.kube/k3s1.yaml JWT_SECRET=… ./scripts/deploy.sh
# <env>` — because it also creates the proxy alias in this namespace. An Ingress
# backend has to name a Service in its own namespace, and Kong's own Service
# lives in `kong`.
#
# Off here, and turned on per brand and ring by `gateway:` in
# `brands/<brand>.yaml`, because only that file knows both — the gateway is
# the brand's own Service in the brand's own namespace.
kong:
  enabled: false
  # Defaults to kong-<brand>-<env>-kong-proxy, which is what that deploy calls
  # the alias. Set it only if a ring names its gateway something else — and
  # never to another brand's, which is a Service that exists and would work.
  serviceName: ""
  servicePort: 80

ingress:
  enabled: true
  # traefik-edge is the only ingress controller on the cloud nodes; the
  # wslproxy controller runs on the home-LAN nodes, which have no pod route
  # here, so an ingress left on that class times out at the edge.
  ingressClassName: traefik-edge
  # Longest prefix first. Traefik does not sort by specificity, so `/` listed
  # before `/api` would swallow the API.
  apiPaths:
    - /api
    - /swagger-ui
    - /health
  annotations: {}
  tls: false
  # Other hostnames that should land on this ring and be sent to `hostname`.
  # Per-ring, because only prod has a bare domain beside its www.
  redirectHosts: []

# Where the browser fetches an uploaded photo: same host, served by MinIO.
# `path` must equal the bucket name in the fishers-minio chart and the end of
# S3_PUBLIC_BASE in the API, or photos upload fine and then never display.
media:
  enabled: true
  path: /media
  serviceName: fishers-minio
  servicePort: 9000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Next serves /login without touching the API, so this tests the web process
# and nothing behind it — which is what a probe on this pod should test.
livenessProbe:
  enabled: true
  path: /login
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /login
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Name of the API service the ingress routes /api to.
apiServiceName: fishers-api
apiServicePort: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Set by the deploy to its run id, so every deploy rolls the pods.
rolloutId: ""

nodeSelector: {}
tolerations: []
affinity: {}
