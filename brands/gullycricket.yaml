# India. Same product, same code, its own stack — own namespace, own API, own
# database. Nothing is shared with Fishers at runtime.
id: gullycricket
name: GullyCricket
legalName: GullyCricket
tagline: The club app for gully cricket
description: >-
  Fixtures, availability, live scoring and the numbers afterwards — for every
  side that plays where it can find a pitch.

domain: gullycricket.app
rings:
  int: int.gullycricket.app
  test: test.gullycricket.app
  acc: acc.gullycricket.app
  prod: www.gullycricket.app

support:
  email: hello@gullycricket.app

# Tape-ball orange against deep pitch green. Chosen the same way Fishers'
# were: the sources are what the brand looks like, the ramp is what carries
# text, and `npm run brand:check` is what says whether it does.
source:
  primary: "#e8752a"
  primaryPale: "#f7d2b8"
  surface: "#fdf7f2"
  accent: "#1b4d3e"

ramp:
  primary400: "#e8752a"
  primary500: "#c55f1d"
  primary600: "#a54f18"   # darkened until it carries white text
  primary700: "#8a4114"
  primary800: "#6d330f"
  primary900: "#401e09"
  accent400: "#2f7a63"
  accent500: "#246052"
  accent600: "#1b4d3e"
  accent700: "#153c31"
  ink900: "#241a14"
  ink700: "#3d2c22"
  ink500: "#5a4336"

# Mixed from the same orange-brown the light theme uses, not from Fishers'
# green. The text greys are lifted the same way and checked the same way.
dark:
  bg: "#1a1210"
  surface: "#221815"
  surface2: "#2b1e19"
  surface3: "#37271f"
  fg: "#f8f1ec"
  fgMuted: "#e0cdc0"
  fgSubtle: "#c2a693"
  border: "#46332a"
  borderStrong: "#63483a"
  onPrimary: "#2a1409"
  raised: "#2e211b"
  accentPale: "#17302a"

assets:
  icon: brands/gullycricket/icon-192.png
  badge: brands/gullycricket/badge.png

mobile:
  bundleId: app.gullycricket
  displayName: GullyCricket
