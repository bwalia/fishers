<?xml version="1.0" encoding="UTF-8"?>
<!-- Gully Cricket, for light surfaces: the page header, a share card, a
     favicon on a white tab strip.

     The same wicket and the same ball as the app icon, in the same places, so
     the two are one drawing in two lights rather than two drawings. What
     changes is what carries it: chalk is the wrong colour without the wall
     behind it, so the stumps take the brand's deep green.

     It is also the source of badge.png, which Chrome masks down to a
     silhouette — so every part of this has to say something in alpha alone.
     Three bars and a disc do; a glow would not, which is why the dust the
     icon uses is not here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Gully Cricket">
  <defs>
    <radialGradient id="tape" cx="32%" cy="27%" r="80%">
      <stop offset="0" stop-color="#f3934a"/>
      <stop offset=".45" stop-color="#e8752a"/>
      <stop offset=".85" stop-color="#c85c1b"/>
      <stop offset="1" stop-color="#a44a12"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="37.6" cy="29.8" r="6.2"/></clipPath>
  </defs>

  <!-- Three stumps, chalked: not parallel, not the same height, because
       nobody draws them straight. No bails — chalk never has any. -->
  <g fill="none" stroke="#1b4d3e" stroke-linecap="round">
    <g stroke-width="3.1">
      <path d="M13.2 11.4q-.9 11.8-.6 23.8" opacity=".88"/>
      <path d="M20.6 10.6q.4 12.4-.1 24.6"/>
      <path d="M28 11.3q1 11.7.7 23.6" opacity=".84"/>
    </g>
    <!-- The crease. Lighter than the stumps on a page, where there is no wall
         to lose it against. -->
    <path d="M5.6 39.8c10.4-1.9 26.6-2 36.8-.2" stroke-width="1.7" opacity=".45"/>
  </g>

  <circle cx="37.6" cy="29.8" r="6.2" fill="url(#tape)"/>
  <!-- Electrical tape wound round a tennis ball: you see its edges, so they
       curve with the sphere and stop where it turns away. -->
  <g clip-path="url(#ball)" fill="none" stroke="#8f3d06" stroke-linecap="round">
    <path d="M30.9 26.7q6.8-2 13.2 1" stroke-width=".92" opacity=".45"/>
    <path d="M31 30.8q6.6-2.1 13 .9" stroke-width="1" opacity=".5"/>
    <path d="M32.1 34.5q5.7-2 11 .8" stroke-width=".92" opacity=".4"/>
  </g>
  <ellipse cx="35.2" cy="27.1" rx="2.1" ry="1.5" fill="#fff" opacity=".24"
           transform="rotate(-30 35.2 27.1)"/>
</svg>
