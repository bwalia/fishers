components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
        user: { type: object, additionalProperties: true }
    CreateClubRequest:
      type: object
      required: [name, sport_types]
      properties:
        name: { type: string }
        sport_types:
          type: array
          items: { type: string }
        visibility: { type: string }
        description: { type: string }
        is_informal_group: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price_cents: { type: integer }
        currency: { type: string }
        category:
          type: string
          enum: [food, drink, kit_hire, merchandise, equipment, other]
        stock: { type: integer, nullable: true }
        active: { type: boolean }
    CreateProductRequest:
      type: object
      required: [name, price_cents, category]
      properties:
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer }
        currency: { type: string }
        category:
          type: string
          enum: [food, drink, kit_hire, merchandise, equipment, other]
        stock: { type: integer }
    PlaceOrderRequest:
      type: object
      required: [club_id, items]
      properties:
        club_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, nullable: true }
        note: { type: string }
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }

security:
  - bearerAuth: []
