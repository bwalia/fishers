openapi: 3.1.0
info:
  title: Fishers API
  version: 0.1.0
  description: |
    Multi-sport club management API (auth, clubs, fixtures, selection, cricket scoring,
    chat agent, shop, payments). Base path `/api/v1`. JWT Bearer for protected routes.
  contact:
    name: Fishers
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local API
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Clubs
  - name: Events
  - name: Availability
  - name: Selection
  - name: Cricket
  - name: Chat
  - name: Orders
  - name: Payments
  - name: Tournament
  - name: Notifications
  - name: Stats
  - name: Accounts
    description: Club books. The club owner or a treasurer only — every route returns 403 `accounts_forbidden` to anyone else, secretaries included.

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      servers:
        - url: http://127.0.0.1:8080
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Tokens + user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens + user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /me:
    get:
      tags: [Users]
      summary: Current user profile
      responses:
        "200":
          description: Public user
    patch:
      tags: [Users]
      summary: Update profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated user

  /clubs:
    get:
      tags: [Clubs]
      summary: List my clubs
      responses:
        "200":
          description: Club list
    post:
      tags: [Clubs]
      summary: Create club
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClubRequest"
      responses:
        "200":
          description: Club

  /me/clubs:
    get:
      tags: [Clubs]
      summary: My clubs, filtered and paged
      description: >
        The clubs screen's list. Each item is a club with your role in it,
        member_count, team_count and public_slug (set only when its public page
        is published). GET /clubs still returns every club as one array.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matched against name and description }
        - { name: role, in: query, schema: { type: string, enum: [secretary, captain, vice_captain, member] } }
        - { name: sport, in: query, schema: { type: string, enum: [cricket, football, badminton, paddle, pickleball, tennis, other] } }
        - { name: public_page, in: query, schema: { type: boolean }, description: Only clubs with (true) or without (false) a published public page }
        - { name: sort, in: query, schema: { type: string, enum: [name, recent, members], default: name } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: "Page of memberships: items, total, page, per_page, has_more"

  /clubs/{id}:
    get:
      tags: [Clubs]
      summary: Get club
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Club

  /clubs/{id}/my-role:
    get:
      tags: [Clubs]
      summary: My role and permissions in the club
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Role info including can_score_match

  /clubs/{id}/members:
    get:
      tags: [Clubs]
      summary: List members
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Members
    post:
      tags: [Clubs]
      summary: Add / update member role (secretary)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK

  /clubs/{id}/teams:
    get:
      tags: [Clubs]
      summary: List teams
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Teams
    post:
      tags: [Clubs]
      summary: Create team
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Team

  /clubs/{id}/venues:
    get:
      tags: [Clubs]
      summary: List venues
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Venues
    post:
      tags: [Clubs]
      summary: Create venue
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Venue

  /clubs/{id}/products:
    get:
      tags: [Orders]
      summary: List active shop products
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags: [Orders]
      summary: Create product (ManageClubOps)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Product

  /me/stats:
    get:
      tags: [Stats]
      summary: My Play-Cricket season stats and achievements
      parameters:
        - name: season
          in: query
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: Links, seasons, achievements

  /users/{id}/stats:
    get:
      tags: [Stats]
      summary: Player season stats (shared club)
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: season
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Season rows

  /users/{id}/achievements:
    get:
      tags: [Stats]
      summary: Player achievements
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Awards

  /clubs/{id}/stats:
    get:
      tags: [Stats]
      summary: Club season board and leaderboards
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: season
          in: query
          schema:
            type: integer
            example: 2026
      responses:
        "200":
          description: Club board

  /clubs/{id}/stats/sync:
    post:
      tags: [Stats]
      summary: Sync Play-Cricket (secretary; sample if no token)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sync result

  /achievements:
    get:
      tags: [Stats]
      summary: Achievement catalogue
      responses:
        "200":
          description: defs

  /events:
    get:
      tags: [Events]
      summary: List fixtures
      parameters:
        - name: club_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cricket_season
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Events
    post:
      tags: [Events]
      summary: Create fixture
      responses:
        "200":
          description: Event

  /events/{id}:
    get:
      tags: [Events]
      summary: Event detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event

  /events/{id}/rsvp:
    post:
      tags: [Events]
      summary: RSVP to fixture
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK

  /events/{id}/attendees:
    get:
      tags: [Events]
      summary: Attendees
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Attendees

  /events/{id}/invite:
    post:
      tags: [Events]
      summary: Invite to play (captain/secretary)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK

  /events/{id}/selection:
    get:
      tags: [Selection]
      summary: Selection board
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Board
    post:
      tags: [Selection]
      summary: Set squad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Board

  /events/{id}/selection/suggest:
    post:
      tags: [Selection]
      summary: Deterministic squad suggestion
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Proposal

  /events/{id}/selection/agent:
    post:
      tags: [Selection]
      summary: Assistant squad pick
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Proposal

  /events/{id}/selection/publish:
    post:
      tags: [Selection]
      summary: Announce current squad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK

  /events/{id}/selection/respond:
    post:
      tags: [Selection]
      summary: Player reconfirm / decline
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK

  /events/{id}/cricket-match:
    get:
      tags: [Cricket]
      summary: Get cricket match for fixture
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Match
    post:
      tags: [Cricket]
      summary: Create or link cricket match
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overs_limit: { type: integer, default: 20 }
                home_name: { type: string }
                away_name: { type: string }
      responses:
        "200":
          description: Match

  /cricket/matches/{id}:
    get:
      tags: [Cricket]
      summary: Match state + sync cursor
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Match

  /cricket/matches/{id}/claim-scorer:
    post:
      tags: [Cricket]
      summary: Claim active scorer lock
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string }
      responses:
        "200":
          description: Match
        "409":
          description: Another scorer holds the lock

  /cricket/matches/{id}/events:
    get:
      tags: [Cricket]
      summary: Scoring events after seq
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: after_seq
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Event list
    post:
      tags: [Cricket]
      summary: Batch sync client scoring events
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { type: string }
                events:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Updated match

  /cricket/matches/{id}/scorecard:
    get:
      tags: [Cricket]
      summary: Scorecard projection
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MatchState

  /events/{id}/motm:
    get:
      tags: [Man of the match]
      summary: The club's man-of-the-match vote for a fixture
      description: >-
        Opens on its own when the match finishes. The tally is withheld until
        the caller has voted or the vote has closed.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MotmPollView
        "404":
          description: This fixture has no vote

  /motm/polls/{id}:
    get:
      tags: [Man of the match]
      summary: One vote, as the caller may see it
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MotmPollView

  /motm/polls/{id}/vote:
    post:
      tags: [Man of the match]
      summary: Vote, or move a vote already cast
      description: >-
        Any active member of either club, whether or not they played. One vote
        each, changeable while the vote is open.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MotmPollView, now with the tally
        "400":
          description: That player was not named on either team sheet
        "403":
          description: Not a member of either club
        "409":
          description: Voting has closed
    delete:
      tags: [Man of the match]
      summary: Take a vote back
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MotmPollView

  /motm/polls/{id}/close:
    post:
      tags: [Man of the match]
      summary: End the vote early and announce the winner
      description: >-
        Captain or secretary. A vote closes itself when its window is up, so
        this is only for calling it sooner. A tie closes with no winner.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: MotmPollView
        "409":
          description: Already closed

  /availability:
    get:
      tags: [Availability]
      summary: My availability window
      responses:
        "200":
          description: Days
    post:
      tags: [Availability]
      summary: Upsert one day
      responses:
        "200":
          description: Day

  /conversations:
    get:
      tags: [Chat]
      summary: My conversations
      responses:
        "200":
          description: Threads
    post:
      tags: [Chat]
      summary: Create conversation
      responses:
        "200":
          description: Conversation

  /conversations/{id}/messages:
    get:
      tags: [Chat]
      summary: Messages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Messages
    post:
      tags: [Chat]
      summary: Post message
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Message

  /conversations/{id}/agent/analyse:
    post:
      tags: [Chat]
      summary: Run admin assistant on thread
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Analysis + proposals

  /agent/proposals/{id}/apply:
    post:
      tags: [Chat]
      summary: Apply proposal via domain services
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Proposal

  /agent/proposals/{id}/dismiss:
    post:
      tags: [Chat]
      summary: Dismiss proposal
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Proposal

  /orders:
    post:
      tags: [Orders]
      summary: Place shop order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "200":
          description: Order

  /orders/mine:
    get:
      tags: [Orders]
      summary: My orders
      responses:
        "200":
          description: Orders

  /payments/intent:
    post:
      tags: [Payments]
      summary: Create payment intent (stub)
      responses:
        "200":
          description: Intent

  /fixture-blocks:
    get:
      tags: [Tournament]
      summary: List fixture blocks
      responses:
        "200":
          description: Blocks
    post:
      tags: [Tournament]
      summary: Create tournament / tour block
      responses:
        "200":
          description: Block

  /notifications/register-device:
    post:
      tags: [Notifications]
      summary: Register push device
      responses:
        "200":
          description: OK

  /clubs/{id}/members/{user_id}/treasurer:
    put:
      tags: [Accounts]
      summary: "Make a member treasurer, or stop them (owner or secretary; grants the appointer nothing)"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts:
    get:
      tags: [Accounts]
      summary: "Overview: access, years, categories, money accounts, the open year's report"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/audit:
    get:
      tags: [Accounts]
      summary: "Audit trail of every change to the books"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/periods:
    post:
      tags: [Accounts]
      summary: "Open an accounting year (b/f, bank and stock carry from last year)"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}:
    patch:
      tags: [Accounts]
      summary: "Edit a year's label, opening balance (first year only) or report text"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/close:
    post:
      tags: [Accounts]
      summary: "Close a year; its figures stop moving"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/reopen:
    post:
      tags: [Accounts]
      summary: "Reopen a closed year (owner only, with a reason)"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/report:
    get:
      tags: [Accounts]
      summary: "Income & Expenditure, balance sheet, reconciliation and insights, with last year beside it"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/periods/{pid}/transactions:
    get:
      tags: [Accounts]
      summary: "List a year's transactions"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
    post:
      tags: [Accounts]
      summary: "Add income, expenditure or a prior-period adjustment"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/debts:
    get:
      tags: [Accounts]
      summary: "Debtors and creditors as they stood at the year end"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/periods/{pid}/suggestions:
    get:
      tags: [Accounts]
      summary: "Fees paid in the app not yet in the books, and fees still unpaid"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/periods/{pid}/accept-payments:
    post:
      tags: [Accounts]
      summary: "Take app payments into the books (settles an owed fee instead of counting it twice)"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/raise-unpaid-fees:
    post:
      tags: [Accounts]
      summary: "Raise unpaid match fees as debtors, one per member per fixture"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

  /clubs/{id}/accounts/periods/{pid}/stock:
    get:
      tags: [Accounts]
      summary: "Stock at the start and end of the year"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/periods/{pid}/money:
    get:
      tags: [Accounts]
      summary: "Money accounts: opening, computed closing, statement figure"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }

  /clubs/{id}/accounts/transactions/{tid}:
    patch:
      tags: [Accounts]
      summary: "Edit a transaction in an open year"
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: tid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "403": { description: Not the owner or a treasurer }
        "409": { description: The year is closed, or the change conflicts }

