[package]
name = "fishers-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fishers-api"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
fishers-agent = { path = "../agent" }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
# Renders club QR codes as SVG so every client just displays one, rather than
# each platform carrying its own encoder.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fishers-db = { path = "../db" }
fishers-domain = { path = "../domain" }
fishers-jobs = { path = "../jobs" }
fishers-notifications = { path = "../notifications" }
fishers-payments = { path = "../payments" }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
