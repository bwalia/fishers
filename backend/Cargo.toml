[workspace]
resolver = "2"
members = [
    "agent",
    "api",
    "domain",
    "db",
    "payments",
    "notifications",
    "jobs",
]
default-members = ["api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Fishers"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.12"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# SMTP for verification codes and reminders. rustls rather than the default
# native-tls, like everything else here: ring and webpki-roots are already in
# the tree, so this pulls in no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
# tls-rustls-ring-webpki: the Zalando (Spilo) clusters the API runs against in
# k3s reject every non-TLS connection from another pod (`hostnossl all all all
# reject` in their pg_hba), so without it the API cannot reach its database at
# all. ring is already in the tree through reqwest, so this adds no toolchain.
# A plain local Postgres without TLS still works: sslmode defaults to prefer.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.19", features = ["derive"] }
# RFC 8291 payload encryption and RFC 8292 VAPID. Hand-rolling ECDH + HKDF +
# AES-GCM is exactly the kind of crypto nobody should write themselves.
#
# Pure RustCrypto rather than the `web-push` crate, whose `ece` dependency
# links OpenSSL — this workspace is rustls throughout and the runtime image has
# no OpenSSL in it. This one hands back an `http::Request` with the encrypted
# body and the headers to send it with; reqwest posts that perfectly well.
web-push-native = "0.5"
