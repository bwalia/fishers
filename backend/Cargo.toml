[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/domain",
    "crates/db",
    "crates/payments",
    "crates/notifications",
    "crates/jobs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "derive",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

fishers-domain = { path = "crates/domain" }
fishers-db = { path = "crates/db" }
fishers-payments = { path = "crates/payments" }
fishers-notifications = { path = "crates/notifications" }
fishers-jobs = { path = "crates/jobs" }

[profile.dev]
debug = 0
